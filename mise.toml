# Install tools with `mise install`. Rust configuration is in rust-toolchain.toml.

# The reference engines under engines/ are deliberately outside this file. Their
# toolchains (OCaml and opam today) are not part of the product build, and the versions
# they are held to live in the conform-ocaml job of .github/workflows/ci.yml, which is the
# single source of them; engines/ocaml/README.md records them for a reader. A developer
# who has not installed them still passes `just ci`, where `conform-engines` skips loudly
# and the CI job is the enforcing gate.

[tools]
rust = "stable"

lefthook = "2.1.9"
committed = "1.1.11"
just = "1.50.0"

typos = "1.48.0"
taplo = "0.10.0"
actionlint = "1.7.12"
zizmor = "1.28.0"
shellcheck = "0.11.0"

# REUSE runs through uvx.
uv = "0.11.32"

cargo-binstall = "1.21.1"

"cargo:cargo-msrv" = "0.19.3"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-hack" = "0.6.45"
"cargo:cargo-nextest" = "0.9.140"
"cargo:cargo-shear" = "1.13.3"
"cargo:cargo-mutants" = "27.1.0"
"cargo:cargo-fuzz" = "0.13.2"
"cargo:cargo-llvm-cov" = "0.9.0"
"cargo:cargo-cyclonedx" = "0.5.9"
"cargo:cargo-semver-checks" = "0.50.0"

[settings.cargo]
binstall = true

[tasks.hooks]
description = "Install the git hooks (see lefthook.yml)"
run = "lefthook install"
