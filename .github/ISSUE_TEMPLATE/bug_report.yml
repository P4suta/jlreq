name: Bug report
description: A panic, a hang, a compile failure, or an API that does not do what it documents
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        For output you believe is composed incorrectly, use **Layout disagreement** instead.
        For a panic or hang on untrusted input, see [SECURITY.md](../../SECURITY.md) first —
        that is a security report, not an issue.

  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: The smallest program or `just` command that shows it.
      render: rust
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "jlreq 0.1.0, rustc 1.85.0, x86_64-unknown-linux-gnu"
    validations:
      required: true
