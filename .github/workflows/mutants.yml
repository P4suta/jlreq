# Manual runs cover all three handwritten Rust products in four shards.
# Pull-request smoke mutation belongs to CI so its result feeds the single required aggregation gate there.
# Generated tables and the equivalent mutants in docs/mutation-ledger.toml are the only configured exclusions.
# A missed or timed-out mutant fails the workflow.
name: Mutants

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: full (${{ matrix.crate }}, shard ${{ matrix.shard.display }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        crate: [jlreq, jlreq-core, jlreq-conformance]
        shard:
          - index: 0
            display: 1
          - index: 1
            display: 2
          - index: 2
            display: 3
          - index: 3
            display: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
        env:
          RUSTUP_PERMIT_COPY_RENAME: "1"
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: just@1.50.0,cargo-mutants@27.1.0,nextest@0.9.140
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: just mutants "$MUTANT_CRATE" "$MUTANT_SHARD"
        env:
          MUTANT_CRATE: ${{ matrix.crate }}
          MUTANT_SHARD: ${{ matrix.shard.index }}/4
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-${{ matrix.crate }}-${{ matrix.shard.display }}-of-4
          path: mutants.out/
          if-no-files-found: error
          retention-days: 14
