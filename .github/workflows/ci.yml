# Ordinary checks use the existing Just recipes.
# Manual campaigns and release acceptance retain exploratory and packaging checks.
# The required status aggregates Linux, desktop, and independent-engine checks.
name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: short

jobs:
  linux:
    name: Linux checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up stable Rust
        env:
          RUSTUP_PERMIT_COPY_RENAME: "1"
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target thumbv7em-none-eabi --target wasm32-unknown-unknown --no-self-update
          rustup default stable
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: >-
            just@1.50.0,taplo-cli@0.10.0,typos@1.49.0,nextest@0.9.140,
            cargo-hack@0.6.45,cargo-msrv@0.19.3,cargo-deny@0.20.2,
            cargo-shear@1.13.3,cargo-semver-checks@0.50.0,
            shellcheck@0.11.0,zizmor@1.28.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.11.32
      - name: Install verified actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          # Official digest published on the v1.7.12 GitHub Release asset.
          ACTIONLINT_LINUX_AMD64_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |-
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          archive="$RUNNER_TEMP/$asset"
          curl --fail --show-error --location --retry 5 --retry-connrefused \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$asset"
          printf '%s  %s\n' "$ACTIONLINT_LINUX_AMD64_SHA256" "$archive" |
            sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Stable gates with warnings denied
        env:
          RUSTFLAGS: -D warnings
        run: just lint feature-matrix test-ci examples no-std wasm design
      - name: Source, dependency, and documentation gates
        run: >-
          just fmt-check toml-check typos doc semver deny shear reuse
          shellcheck actionlint zizmor
      - name: Verify declared MSRVs
        run: just msrv

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up stable Rust
        shell: bash
        env:
          RUSTUP_PERMIT_COPY_RENAME: "1"
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just@1.50.0,nextest@0.9.140
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Layout is integer arithmetic over in-memory text (docs/adr/0005), so results are
      # bit-identical across these three platforms. A per-OS difference is a bug, not an
      # acceptable tolerance, and this matrix is what proves it.
      - run: just test-ci

  conform-ocaml:
    # The independent OCaml reference engine (engines/ocaml/README.md) answering the
    # conformance protocol from an implementation that shares no code with the Rust one
    # and reads the other locale's transcription of Appendices B through E.
    #
    # The gate is the cumulative suite engines/ocaml/milestones/CURRENT points at, not the
    # whole one: the engine is written a milestone at a time and is held to exactly what it
    # claims, so a merge is blocked by a regression rather than by work not yet done. At M9
    # that file reaches 9, the cumulative suite is all eighty-nine cases, and this gate and
    # `just conform-ocaml` are the same run.
    name: conform-ocaml (independent OCaml engine)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up stable Rust
        shell: bash
        env:
          RUSTUP_PERMIT_COPY_RENAME: "1"
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just@1.50.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # `dune-cache: true` is also what installs dune into the switch. The action puts opam
      # on PATH but deliberately not the switch's own bin directory, so the gate runs under
      # `opam exec --`; everything inside it is the recipe a developer runs locally.
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: "5.5.0"
          dune-cache: true
      - run: opam exec -- just ocaml-gate

  conform-racket:
    # The independent Racket reference engine (engines/racket/README.md), on the same
    # terms as conform-ocaml: it shares no code with the Rust engine, builds its tables
    # from spec/ rather than from crates/jlreq-core/src/generated/, and is gated by the
    # cumulative suite engines/racket/milestones/CURRENT points at rather than by the
    # whole one.
    name: conform-racket (independent Racket engine)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTFLAGS: -D warnings
      # The single source for the Racket version, alongside engines/racket/README.md.
      # A full version number and not `stable`: every computation in the engine is exact
      # integer arithmetic, so the answers do not depend on the release, and the pin is
      # for reproducibility of the build.
      RACKET_VERSION: "9.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up stable Rust
        shell: bash
        env:
          RUSTUP_PERMIT_COPY_RENAME: "1"
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just@1.50.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: Bogdanp/setup-racket@8889db76ff6cdc86df8aa09fdd1729cd090b7144 # v1.16
        with:
          version: ${{ env.RACKET_VERSION }}
          variant: CS
          distribution: minimal
      # `distribution: minimal` ships `raco pkg`, `raco setup` and `raco link` and no
      # other command, so every `raco` the recipes call — `make`, `exe` and `test` —
      # arrives with compiler-lib; rackunit-lib is the test framework. engines/racket/info.rkt
      # declares the same two collections, and this line is what has to agree with it.
      - name: install the collections the engine builds and tests with
        run: raco pkg install --skip-installed --batch --auto --no-docs compiler-lib rackunit-lib
      - run: just racket-gate

  ci-required:
    name: ci-required
    if: always()
    needs: [linux, test, conform-ocaml, conform-racket]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "${RESULTS}"
          jq -e 'keys == ["conform-ocaml", "conform-racket", "linux", "test"] and all(.[]; .result == "success")' <<< "${RESULTS}"

  required:
    name: required
    if: always()
    needs: [ci-required]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the CI aggregate to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "${RESULTS}"
          jq -e 'keys == ["ci-required"] and all(.[]; .result == "success")' <<< "${RESULTS}"
