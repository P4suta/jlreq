# CI for jlreq (JLReq 2020 Japanese line composition, including the JIS X 4051
# alternatives JLReq records; complete JIS X 4051 conformance is not claimed).
#
# Layout under test:
#   - jlreq              dependency-free no_std + alloc public library.
#   - jlreq-conformance  binary-only protocol runner and sample engine.
#   - xtask          repository policy checks shared by Just and CI.
#   - engines/ocaml      an independent reference engine, outside the Cargo workspace,
#                        built and gated by the conform-ocaml job alone.
#   - engines/racket     a second independent reference engine, on the same terms, built
#                        and gated by the conform-racket job alone.
#
# Policy:
#   - Every third-party action is SHA-pinned (Dependabot bumps them weekly); the comment
#     records the human-readable version.
#   - Every job runs the same `just` recipe a developer runs locally, so CI and the dev box
#     cannot drift.
#   - `no_std`, `wasm`, and `purity` are required gates, not advisory ones. They are what
#     make the architecture in docs/adr/ true rather than aspirational.
#   - A single `ci-required` aggregation gate is the one status context branch protection
#     references, so the ruleset never desyncs as jobs are added or renamed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref to keep the queue lean.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  # NOTE: `-D warnings` is applied per job, only on the stable toolchain we can reproduce
  # locally. It is deliberately not global: the msrv job installs an older toolchain whose
  # version-specific warnings would turn CI red for a reason invisible to every local gate.
  # That job still fails on real errors.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: just@1.50.0
      - run: just fmt-check

  toml:
    name: taplo (TOML formatting)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: just@1.50.0,taplo-cli@0.10.0
      - run: just toml-check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: just@1.50.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: just lint

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: just@1.50.0,nextest@0.9.140
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Layout is integer arithmetic over in-memory text (docs/adr/0005), so results are
      # bit-identical across these three platforms. A per-OS difference is a bug, not an
      # acceptable tolerance, and this matrix is what proves it.
      - run: just test-ci

  feature-matrix:
    name: feature matrix (cargo-hack, all targets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: just@1.50.0,cargo-hack@0.6.45
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: just feature-matrix

  no_std:
    name: no_std (thumbv7em, no FPU)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: thumbv7em-none-eabi
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: just@1.50.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Building the layout core for a bare-metal target with no std and no hardware
      # floating-point unit proves docs/adr/0001 and docs/adr/0005 physically rather than
      # by convention.
      - run: just no-std

  wasm:
    name: wasm (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: just@1.50.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # No font- or IO-coupled layout engine can do this. Keeping it green is the practical
      # test of whether the boundary in docs/adr/0003 still holds.
      - run: just wasm

  fuzz:
    name: fuzz (public API invariants)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # nightly
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: just@1.50.0,cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz -> target
      - run: just fuzz-check-linux-ci

  purity:
    name: purity (no std, I/O, font, or float in the core)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: just@1.50.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: just purity

  design:
    # The gates that hold the frozen design (docs/design/api-spine.md). Each reads the
    # tree and none needs the network, so they run together in one job. `purity` runs
    # above on its own because branch protection already names it.
    name: design (the frozen design holds mechanically)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: just@1.50.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # One recipe rather than the steps enumerated by hand. The two drifted once already:
      # `derive-check` — the only gate that binds spec/derived/ to the vendored W3C document
      # — was added to the `design` aggregate and never to this list, so for as long as that
      # lasted a transcribed derived table and a generated one were indistinguishable to the
      # enforcement path that gates a merge. A job that runs the aggregate cannot drift from
      # it.
      - run: just design

  conform-ocaml:
    # The independent OCaml reference engine (engines/ocaml/README.md) answering the
    # conformance protocol from an implementation that shares no code with the Rust one
    # and reads the other locale's transcription of Appendices B through E.
    #
    # The gate is the cumulative suite engines/ocaml/milestones/CURRENT points at, not the
    # whole one: the engine is written a milestone at a time and is held to exactly what it
    # claims, so a merge is blocked by a regression rather than by work not yet done. At M9
    # that file reaches 9, the cumulative suite is all eighty-nine cases, and this gate and
    # `just conform-ocaml` are the same run.
    name: conform-ocaml (independent OCaml engine)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: just@1.50.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `dune-cache: true` is also what installs dune into the switch. The action puts opam
      # on PATH but deliberately not the switch's own bin directory, so the gate runs under
      # `opam exec --`; everything inside it is the recipe a developer runs locally.
      - uses: ocaml/setup-ocaml@f92e0606b7ae4873dd1238465ea4bf6f8e40d85c # v3.7.2
        with:
          ocaml-compiler: "5.5.0"
          dune-cache: true
      - run: opam exec -- just ocaml-gate

  conform-racket:
    # The independent Racket reference engine (engines/racket/README.md), on the same
    # terms as conform-ocaml: it shares no code with the Rust engine, builds its tables
    # from spec/ rather than from crates/jlreq/src/generated/, and is gated by the
    # cumulative suite engines/racket/milestones/CURRENT points at rather than by the
    # whole one.
    name: conform-racket (independent Racket engine)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTFLAGS: -D warnings
      # The single source for the Racket version, alongside engines/racket/README.md.
      # A full version number and not `stable`: every computation in the engine is exact
      # integer arithmetic, so the answers do not depend on the release, and the pin is
      # for reproducibility of the build.
      RACKET_VERSION: "9.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: just@1.50.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        with:
          version: ${{ env.RACKET_VERSION }}
          variant: CS
          distribution: minimal
      # `distribution: minimal` ships `raco pkg`, `raco setup` and `raco link` and no
      # other command, so every `raco` the recipes call — `make`, `exe` and `test` —
      # arrives with compiler-lib; rackunit-lib is the test framework. engines/racket/info.rkt
      # declares the same two collections, and this line is what has to agree with it.
      - name: install the collections the engine builds and tests with
        run: raco pkg install --skip-installed --batch --auto --no-docs compiler-lib rackunit-lib
      - run: just racket-gate

  doc:
    name: doc (rustdoc, warnings are errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: just@1.50.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - env:
          RUSTDOCFLAGS: -D warnings
        run: just doc

  package:
    name: cargo package (release readiness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: just@1.50.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: just package

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0

  msrv:
    name: msrv (workspace 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: cargo-msrv@0.19.3,just@1.50.0
      # `cargo-msrv verify` reads each crate's declared `rust-version` and proves it builds
      # on that floor.
      - name: verify declared MSRVs
        run: just msrv

  reuse:
    name: reuse (SPDX/REUSE compliance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: just@1.50.0
      # Run REUSE through `uvx` exactly as `just reuse` does locally rather than the
      # `fsfe/reuse-action` Docker action, whose anonymous Docker Hub pulls fail
      # intermittently for reasons unrelated to compliance.
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: 0.11.32
      - run: just reuse

  deny:
    name: dependency policy (cargo-deny + cargo-shear)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: cargo-deny@0.20.2,cargo-shear@1.13.3,just@1.50.0
      - run: just deny
      - run: just shear

  actionlint:
    name: actionlint + zizmor (workflow self-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: just@1.50.0,zizmor@1.28.0
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          # Official digest published on the v1.7.12 GitHub Release asset.
          ACTIONLINT_LINUX_AMD64_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |-
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          archive="$RUNNER_TEMP/$asset"
          curl --fail --show-error --location --retry 5 --retry-connrefused \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$asset"
          printf '%s  %s\n' "$ACTIONLINT_LINUX_AMD64_SHA256" "$archive" |
            sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: zizmor (offline, high severity)
        run: just zizmor

  # Single aggregation gate. `if: always()` makes failures and cancellations visible
  # through the one branch-protection status.
  ci-required:
    name: ci-required
    if: always()
    needs:
      - fmt
      - toml
      - clippy
      - test
      - feature-matrix
      - no_std
      - wasm
      - fuzz
      - purity
      - design
      - conform-ocaml
      - conform-racket
      - doc
      - package
      - typos
      - msrv
      - reuse
      - deny
      - actionlint
    runs-on: ubuntu-latest
    steps:
      - name: verify all required jobs passed (skipped counts as pass)
        run: |-
          results="${{ join(needs.*.result, ' ') }}"
          echo "needs results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::a required job did not pass ($r)"
              exit 1
            fi
          done
          echo "all required jobs passed"
