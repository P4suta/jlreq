# Inert release configuration for the unreleased 0.0.0 development workspace.
# Publishing, tags, releases, and changelog mutation stay disabled until a maintainer makes
# a separate, explicit release decision.

[workspace]
dependencies_update = false
release_always = false
semver_check = false
git_tag_enable = false
git_release_enable = false
changelog_update = false

[[package]]
name = "jlreq"
version_group = "jlreq"
changelog_update = false
changelog_path = "./CHANGELOG.md"
changelog_include = ["jlreq", "jlreq-conformance"]
git_tag_enable = false
git_tag_name = "v{{ version }}"
git_release_enable = false
git_release_draft = false

[[package]]
name = "jlreq-conformance"
version_group = "jlreq"
