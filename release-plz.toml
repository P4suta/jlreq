# Release configuration for the 1.0 library and its versioned conformance CLI.

[workspace]
dependencies_update = false
release_always = false
semver_check = true
git_tag_enable = false
git_release_enable = false
changelog_update = false

[[package]]
name = "kumihan"
version_group = "kumihan"
changelog_update = true
changelog_path = "./CHANGELOG.md"
changelog_include = ["kumihan", "kumihan-conformance"]
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true
git_release_draft = true

[[package]]
name = "kumihan-conformance"
version_group = "kumihan"
