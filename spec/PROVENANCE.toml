# Provenance of every upstream file this repository reads.
#
# `cargo run -p xtask -- attest --digests` reads the `[[document]]` blocks below and hashes
# each recorded file that is present on disk. That is the form `just attest` runs and the
# form CI runs: without it the digest chain is a closed loop, because every derived file
# states the digest of the snapshot as it currently sits on disk and `derive --check`
# rereads whatever is there. This file is what anchors that loop to the bytes W3C and
# Unicode published. No gate fetches anything: CI must not depend on w3.org or unicode.org
# being reachable (docs/design/generation.md).
#
# `cargo run -p xtask -- derive` reads this file too, and closes the input directory against
# it: every file vendored under `snapshot/` must be recorded here, every derivation may read
# only a recorded document, and `specification-date` must equal the publication date the
# vendored rendering itself carries.
#
# Every block states:
#
#   path       where the file sits, relative to spec/
#   url        where these bytes were retrieved from
#   retrieved  the date this repository fetched them
#   sha256     their digest, lowercase hex
#   bytes      their length
#   published  the date the upstream work itself carries
#   purpose    what this repository reads the file for
#
# The files under `snapshot/` are committed, so regeneration needs no network and the
# byte-identity check is a hard `git diff --exit-code` rather than a job that can fail
# for connectivity. The files under `upstream/` are not committed: `.gitignore`
# excludes that directory, because the six matrices are published only as PDF and a
# PDF is not a source this project derives anything from (ADR 0009). They are recorded
# anyway, so that a developer transcribing a matrix can prove the bytes in front of
# them are the bytes this repository was written against:
#
#   mkdir -p spec/upstream
#   for number in 2 3 4 5 6 7; do
#     for locale in en ja; do
#       curl -sS -o "spec/upstream/table_$locale$number.pdf" \
#         "https://www.w3.org/TR/jlreq/tables/table_$locale$number.pdf"
#     done
#   done
#   cargo run -p xtask -- attest --digests
#
# One upstream file is deliberately absent. The pre-ReSpec editorial source at
# https://raw.githubusercontent.com/w3c/jlreq/gh-pages/index.html carries the same 25
# charclass tables, but it has no generated section numbers and 861 unresolved
# cross-reference placeholders, so ADR 0013's requirement that a rule address quote the
# document's own rendered numbering cannot be met from it. It was retrieved 2026-08-05
# and measured at 1925819 bytes, sha256
# 121eaf237819942c1e26c074bde48e4238428f899777ec2fdd95c83637b9f86f. Recording that
# measurement here and vendoring nothing is the whole of its usefulness: a second
# rendering to diff against costs 1.9 MB of committed bytes that no stage reads, and
# `docs/design/generation.md` names exactly one snapshot.

# The revision of JLReq every generated file was generated from. Stated at the top
# level, above the first table, so that a `published` date describing one upstream
# document is never mistaken for the snapshot's own: `cargo run -p xtask -- generate`
# writes this string into the header of every emitted module, and refuses to emit
# anything at all when it is absent.
specification-date = "2020-08-11"

