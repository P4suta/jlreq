# typos — strict spell check across the repo, run by the CI `typos` job
# (crate-ci/typos) and the pre-commit hook. Fix typos rather than suppress them;
# keep the allowlist below to the minimum the Japanese typesetting vocabulary needs.
# Every entry is a term the specification chose, not a word this project misspelled.

[default]
locale = "en-us"

[default.extend-words]
# Japanese typesetting vocabulary used verbatim by JLReq and JIS X 4051.
kumihan = "kumihan"   # 組版 — typesetting
mojikumi = "mojikumi" # 文字組み — inter-character spacing
kinsoku = "kinsoku"   # 禁則 — line-break prohibition
burasage = "burasage" # ぶら下げ — hanging punctuation
oikomi = "oikomi"     # 追い込み — compressing a line to pull a character back
oidashi = "oidashi"   # 追い出し — expanding a line to push a character down
yakumono = "yakumono" # 約物 — punctuation and brackets
ruby = "ruby"         # ルビ — interlinear annotation
jlreq = "jlreq"       # the W3C Requirements for Japanese Text Layout
clreq = "clreq"       # the W3C Requirements for Chinese Text Layout

# Unicode property values a conformance case names, which are the standard's spelling.
Nd = "Nd" # General_Category=Nd, the decimal digits

[default.extend-identifiers]
# The 7-Zip bare-output switch used when auditing Windows release archives.
ba = "ba"
# Registered OpenType variation axis tag (width).
wdth = "wdth"

[files]
extend-exclude = [
  "target/**",
  "**/*.lock",
  # Machine-generated by release-plz from commit subjects; short SHAs split into
  # subtokens and get flagged. The source is reviewed at commit time.
  "CHANGELOG.md",
  # Vendored upstream, byte-exact against spec/PROVENANCE.toml. A spelling here is
  # W3C's or Unicode's, and this project has no standing to correct it: the only
  # edit a finding could justify would break the digest that proves the file is
  # theirs (docs/design/generation.md).
  "spec/snapshot/**",
  "spec/upstream/**",
  # Machine-written readings of those files, quoting them verbatim: the specification's
  # own sentences, its own anchor slugs (`kinds_of_tables_from_alocation_to_page_position`
  # is W3C's spelling) and the Unicode names of the characters it lists. Correcting one
  # here would make the quotation false and would be overwritten by the next
  # `just derive` anyway; the prose these files carry that *is* ours is written in
  # xtask/src/, which typos does read (docs/design/generation.md).
  "spec/derived/**",
  # `just fuzz-check` (cargo-fuzz) writes untracked, random-byte corpus files
  # here locally; they aren't real text and shouldn't be spell-checked.
  "fuzz/corpus/**",
]

[type.toml]
extend-glob = ["*.toml"]

[type.rust]
extend-glob = ["*.rs"]
