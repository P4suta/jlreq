[[equivalent]]
mutant = "crates/jlreq-core/src/generated.rs:35:5: replace | with ^"
exclude_re = '^crates/jlreq-core/src/generated[.]rs:35:5: replace [|] with \^$'
source_sha256 = "1ae94e171d53337b1cf8f472b5f1ad4d805551207911bbd5d1f4c6dd6563de6c"
proof = "FRAME_FULL_EM is bit 0 and FRAME_HALF_EM is bit 1, so the accumulated operand and the added bit are disjoint; OR and XOR are identical."

