# The scalar allowlist: the items outside `jlreq-unit`'s own `axis` and `length` modules that
# may build one of the axis types from a plain integer, or read one back out.
#
# `InlineOffset`, `BlockOffset`, `InlineExtent`, `BlockExtent` and `Advance` have no
# conversion between any two of them and none between one of them and the caller's scalar:
# no `From`, no `Into`, no `Deref`, no `Ord`, and no arithmetic accepting another axis. The
# `[[no_impl]]` table of docs/api-frozen.toml names every one of those so a later `impl`
# block is a gate failure (docs/adr/0011-typed-axes-and-direction-as-a-datum.md).
#
# `new`, `units` and `get` are the residue, and this project states that rather than claiming
# the separation is total. `BlockExtent::new(inline.units())` is a cross-axis assignment in
# two well-typed steps, and no arrangement of types removes the pair: a value the caller
# supplies must get in, and a position the caller draws must get out. So the untyped channel
# is narrowed rather than denied, and this file is the narrowing.
#
# The `ops` gate rejects any call of `new`, `units` or `get` on one of those five types
# outside `jlreq-unit`'s `axis` and `length` modules and outside an item listed here — the
# `[[scalar_channel]]` table of docs/api-frozen.toml carries the type list, the method list
# and the two home modules. This file is owned by the code owners in .github/CODEOWNERS for
# the same reason the direction allowlist is: the guard is what makes it a control rather
# than documentation, and a cross-axis assignment then has to be argued for in a reviewed
# file rather than written.
#
# The list is short by construction. The inherent arithmetic surface is closed over each axis
# type and every public output is already typed, so what remains is the ratio the badness
# function needs, `align`'s own two crossings, the bridge to the conformance case format, and
# nothing else. A proposed entry that is none of those is first an argument that some output
# is untyped.
#
# Schema. One `[[site]]` table per item, with these three keys and no others:
#
#   crate  The workspace crate the item is declared in, spelled as the package name:
#          `jlreq-line`, not `jlreq_line`.
#   item   The path to the item from its crate root with the crate name omitted: a free
#          function as `compose`, an associated function as `Badness::of`, an inherent method
#          as `Type::method`. This is the enclosing item the gate attributes a call to, so a
#          nested closure or block is named by the item containing it.
#   why    Why a raw quantity is unavoidable at that item, in a sentence a reviewer can
#          disagree with.
#
# Two entries inside `jlreq-unit` itself. `axis.rs` and `length.rs` declare the six length
# types and expand the closed arithmetic macro that serves them, so both are home; `arith.rs`
# holds the two items that accumulate and divide, and each of them ends by turning a count
# this crate computed back into a typed value. Neither can be written any other way — a
# cursor's position is a running `i32` until it is answered, and a distributed part is a
# narrowed `i64` — so they are argued for here rather than hidden by widening the home list.
#
# `jlreq-line`'s `geometry_of` is one more, and not `Badness::of`: the ratio `Badness::of`
# takes reads `residual.units()` in dot-call form, which this gate's scanner — matched on the
# `Type::method` path syntax, not on method resolution — does not see at all, so no entry is
# either read or required there. `geometry_of` earns its entry the ordinary way, by writing
# the syntax the gate does see: `InlineOffset::new` and `InlineOffset::units` as a bare path.
#
# `jlreq-line`'s `align` module adds one more of its own, for the same reason `geometry_of`
# has one and not a second, unrelated one: §3.7.3's jidori (single line alignment,
# `Alignment::EvenSpacing`) needs a fixed weight it cannot get any other way. `one` builds the
# `Advance` weight of `1` every equal-weighted `distribute` split in that module needs; it is a
# function and not a `const` specifically because the gate attributes a crossing to its
# enclosing item and a bare `const` initializer has none ("crate scope" in the gate's own
# report), so a `const` there would be unreviewable by this file rather than exempt from it.
#
# `shift_by` lives in `compose.rs`, not `align.rs`: it started as `align`'s own mirror of
# `geometry_of`'s crossing — pushing a placement *forward* by an already-distributed jidori
# share rather than pulling one *back* by a trim — and moved once `crate::ladder`'s reduction
# and expansion stages needed the identical missing `InlineOffset` / `InlineExtent` operation
# for their own signed per-site deltas (`ADR-0017`'s adjusted geometry pass); one crossing
# serving two callers in one crate is the shared primitive this file's own preamble asks for,
# not two independently drifting copies. It earns its entry on `InlineOffset::new` alone:
# both operands reach it through `.units()` in dot-call form, which is why only one bare path
# appears in it.
#
# `jlreq-conform`'s two entries are its bridge to the conformance case format.

[[site]]
crate = "jlreq-unit"
item = "InlineCursor::position"
why = "a cursor accumulates a bare count of the caller's units across a line, because a saturating addition has to be observed before the value is answered for; `position` is where that count becomes an `InlineOffset` again, and it is the only exit."

[[site]]
crate = "jlreq-unit"
item = "Distribution::next"
why = "a distributed part is computed in `i64`, because the proportional share of a total by a weight leaves `i32` before it comes back; `next` narrows it and returns the one typed value, so the widening and the narrowing are one item apart rather than spread across the module."

[[site]]
crate = "jlreq-line"
item = "geometry_of"
why = "normalized-geometry math the two axis types have no operation for. An item's own placement is pulled back by a leading trim already folded into a gap ahead of it — an `InlineOffset` minus an `InlineExtent`, which no arrangement of the closed arithmetic macro provides — and a line's own extent is its final cursor position read back out, exact because every line's cursor starts at zero (ADR-0017's normalized geometry)."

[[site]]
crate = "jlreq-line"
item = "one"
why = "the fixed `Advance` weight `align`'s equal-weighted `distribute` splits need — Alignment::Centered's two sites and Alignment::EvenSpacing's eligible interior boundaries alike — built once from the literal `1`, which cannot fail; a function rather than a `const` initializer so the crossing has a named enclosing item for this table to review, the same shape `jlreq_spacing::raw`'s `em` already uses for its own narrower one."

[[site]]
crate = "jlreq-line"
item = "shift_by"
why = "the mirror of `geometry_of`'s own entry above, in the other direction: an item's placement is pushed *forward* — by an already-distributed jidori share (Alignment::EvenSpacing, §3.7.3), or by a signed ladder delta (`crate::ladder::reduce`/`expand`, §3.8.3/§3.8.4) — rather than pulled *back* by a leading trim, and `InlineOffset` and `InlineExtent` share no operation for either direction (ADR-0011), so this reads back the two raw unit counts and re-enters the typed channel through `InlineOffset::new`."

[[site]]
crate = "jlreq-line"
item = "distance_to"
why = "§3.6.2's specified-character tab kind needs the distance from a run's own natural start to one named item's own natural placement, to subtract from the caller's declared tab position (`stop.position().sub_sat(distance_to(placement))`); `InlineOffset` and `InlineExtent` share no arithmetic (ADR-0011), so this reads the placement's raw units back out and re-enters the typed channel through `InlineExtent::new`, the same shape `compose.rs`'s own `shift_by` takes in the other direction."

[[site]]
crate = "jlreq-inline"
item = "one"
why = "the fixed `Advance` weight `docs/decisions/mono-ruby-separation-split.md`'s equal-weighted `distribute` split needs, over a mono-ruby run's own §3.3.8 rule 1 surplus — built once from the literal `1`, which cannot fail; a function rather than a `const` initializer for the identical reason `jlreq_line::align`'s own `one` already states, and named identically because it is the same primitive serving the same `distribute` call, one crate over."

[[site]]
crate = "jlreq-inline"
item = "shift_by"
why = "`place()`'s own crossing, the identical shape `jlreq_line::compose`'s own `shift_by` already earns its entry for: an already-resolved base placement is pushed forward or back by a signed centering share (§3.3.5(b)/(c), nakatsuki) or by a solid run's own accumulated advance, and `InlineOffset` and `InlineExtent` share no arithmetic (ADR-0011), so this reads back the two raw unit counts through `.units()` in dot-call form — invisible to this gate's own `Type::method` scanner — and re-enters the typed channel through the one bare path this crossing writes, `InlineOffset::new`. Named identically to `jlreq_line::compose::shift_by` because it is the same primitive, one crate over, not a coincidence of naming."

[[site]]
crate = "jlreq-inline"
item = "two"
why = "the fixed `Advance` weight §3.3.6's own JIS X 4051 method needs at each interior site between two adjacent group-ruby characters — twice `one`'s own weight, the section's own '2 units of inter-character spacing... 1 unit of spacing' ratio between a run's interior sites and its two ends — built once from the literal `2`, which cannot fail; a function rather than a `const` initializer for the identical reason `one` already states. `one`'s own entry above does not cover this one: the gate attributes a crossing to its enclosing item, and `two` is a different item from `one`, even though both build the identical kind of value."

[[site]]
crate = "jlreq-inline"
item = "extent_between"
why = "§3.3.6's own base run extent, measured from a composed line's own `placements` rather than re-derived by summing `ctx.text`'s own item advances (`place.rs`'s own module doc states why): `InlineOffset` and `InlineExtent` share no arithmetic (ADR-0011), so this reads the two already-resolved placements' raw units back out through `.units()` in dot-call form — invisible to this gate's own `Type::method` scanner — and re-enters the typed channel through the one bare path this crossing writes, `InlineExtent::new`. The same shape `jlreq_line::tab::distance_to`'s own entry above already argues for, one crate over, though that one reads a single offset back against an implicit zero rather than the difference of two already-resolved ones."

[[site]]
crate = "jlreq-conform"
item = "item_of"
why = "the bridge to the conformance case format, which is JSON and therefore a plain integer by construction: a published case states an advance in the caller's own unit and every implementation that runs the suite reads it as a number, so the one place the number becomes an `InlineExtent` is where a case's item is turned into `jlreq_unit::Item`."

[[site]]
crate = "jlreq-conform"
item = "advance"
why = "the same bridge for a declared character size, which a case states as two integers because §3.3.3 scales the two axes differently; this is the only item that turns one into an `Advance`, and `Stream::of` builds every `Scale` through it."

[[site]]
crate = "jlreq-conform"
item = "inline_extent"
why = "the same bridge for every length `compose` and `align` read — `measure`, `first_line_indent`, `head_indent` and `end_indent` for the former, `measure` again read as `align`'s own `target` for the latter — which a case states as plain integers in its own unit; this is the only item that turns one into an `InlineExtent` for `Paragraph::new`, `Paragraph::with_first_line_indent`, `Paragraph::with_indents` and `align` alike."

[[site]]
crate = "jlreq-conform"
item = "derived_placements"
why = "the same bridge for a `place` case's own derived line layout (`Compose::place`'s own doc states the derivation in full): the declared item advances and every construct's own forced §3.3.8 rule 1 separation are both plain integers in the case's own caller unit, accumulated in `i64` because the running sum has to be observed before it is answered for (`InlineCursor::position`'s own precedent above, one accumulator serving a case-format bridge rather than a composed line); this is the only item that turns the accumulated total into the `InlineOffset` sequence `jlreq::place` reads as `placements`."
