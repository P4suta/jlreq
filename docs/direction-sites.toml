# Schema. One `[[pending]]` table per rule nothing reads yet, with these three keys and no
# others:
#
#   rule   The specification address of a rule the inventory marks direction-conditional,
#          spelled as above. One table per rule.
#   crate  The core crate whose first item closes it, as a package name. While that crate
#          declares nothing at all, the rule cannot be read anywhere, so check 2 does not run
#          over it and the gate says so by name. The entry is a violation from the moment
#          that crate declares an item, whether or not it is the item that reads the rule.
#   why    Where in that crate the rule will be read, and on whose authority, in a sentence a
#          reviewer can disagree with.
#
# None are open today. §3.1.3, §3.2.5 and §3.3.5 are the whole of the marked set and all
# three are now read by a `[[site]]` entry above, so check 3's own union already equals the
# marked set without this table's help. It stays in the schema rather than being deleted
# with its last two rows, because the mechanism is reusable: a future revision of JLReq
# naming a fourth direction-conditional rule, or a rule this workspace has not reached yet
# turning out to be one, would need it again the identical way M4-a round 1 just retired its
# own two entries — one genuinely read (`lower`, below, for §3.3.5) and one settled honestly
# rather than left to lapse unrepaired once `jlreq-inline` declared its first item made both
# stale at once (`[[pending]]`'s own rule is keyed on whether the crate has declared
# anything at all, not on which item will do the reading — `TateChuYoko::new`, below, is
# what retired the §3.2.5 entry, by implementing the one sentence of tate-chu-yoko that is
# genuinely self-contained rather than the segment-building the rest of the construct still
# awaits).

[[site]]
crate = "jlreq-inline"
item = "lower"
rule = "3.3.5"
why = "3.3.5 recommends against katatsuki ruby alignment in horizontal writing, and lowering is the one place that alignment question is resolved; refusing it at construction would publish a prohibition the specification does not state, so the recommendation is applied here and a caller who overrides it is honored and told. As of M4-a round 7, this identical read also resolves a RubyStyle::JukugoRuby construct's own alignment, on §3.3.7¶1's own wholesale delegation to 'the method described in § 3.3.5' — the same code path, not a second one, so this entry's own scope widens with it rather than needing a sibling entry."

[[site]]
crate = "jlreq-inline"
item = "TateChuYoko::new"
rule = "3.2.5"
why = "ADR 0011 reads 3.2.5 as an availability fact — JLReq defines no horizontal tate-chu-yoko (縦中横) at all — so it is refused at construction, the one place a run of it is ever formed. There is no rule to check the direction against in horizontal writing, only the direction itself, which is what makes this item read the variant rather than a boolean some other function derived from it."

[[site]]
crate = "jlreq-inline"
item = "horizontal"
rule = "3.1.3"
why = "`crate::lower`'s own unit tests build a `Constructs` and call `lower` through this one helper rather than naming a direction at each call site — the same shape `jlreq-spacing`'s own `direction_of` entry above already uses. `lower`'s third parameter has no default (ADR-0011: a datum, never assumed), and the fact under test in every one of those fixtures — the alignment-free split `docs/decisions/mono-ruby-separation-split.md` reads for §3.3.8 — is identical in either writing direction, so horizontal is chosen arbitrarily and this item reads none of 3.1.3, 3.2.5 or 3.3.5 either; the nearest of the three is named per this file's own established practice."

[[site]]
crate = "jlreq-inline"
item = "directions"
rule = "3.2.5"
why = "`crate::tcy`'s own unit tests build one value of each direction through this one helper to exercise `TateChuYoko::new`'s own refusal and its own permission side by side, rather than naming a variant at each call site — the same shape `horizontal` above and `jlreq-line`'s own `feasible_over` already use. Named for 3.2.5 rather than the nearest-of-three convention because it is the rule the two tests it serves are actually about."

[[site]]
crate = "jlreq-inline"
item = "katatsuki_is_honored_and_discouraged_only_in_horizontal_writing"
rule = "3.3.5"
why = "This test names both `Direction` variants directly, in one array literal, rather than through `horizontal` above: its own point is that `Contribution::alignment_discouraged` reads §3.3.5's own discouraged combination — katatsuki resolved in horizontal writing — differently by direction, which is a genuine dependence on the rule and not the 'reads none of the three' shape every `horizontal`-using fixture in this file states. Named for 3.3.5 rather than the nearest-of-three convention because it is the rule this test is actually about, the same choice `directions` above already makes for 3.2.5."
