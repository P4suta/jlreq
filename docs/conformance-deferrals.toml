ted` (the first sentence, different complexes, permitted) and `C.2/two-base-characters-in-one-jukugo-ruby-complex/break-permitted` (the second, same complex, permitted — the load-bearing case: its input differs from `C.2/two-base-characters-in-one-simple-ruby-complex/no-break-inside`'s in exactly one declared field, `style`, and the answer flips from refused to permitted over that field alone, so an implementation that gave every same-run `ruby` construct one always-refuse rule, conflating jukugo-ruby with simple-ruby, fails it). Both sit at the identical cl-19-against-cl-19 coordinate `C.2#6`'s and `C.2#7`'s own entries above verify blank. The scope limit, stated honestly rather than left for the coverage count to imply full coverage: the note's own third sentence — a base character and its accompanying ruby text are indivisible — is not measured by either case and cannot be measured by any case in this suite until the crate graph gives `jlreq-line` an edge to `jlreq-inline` and an annotation stream reaches `Feasible::compute`; `docs/decisions/jukugo-ruby-unset-group.md`'s own reading of an absent group, which the same-complex case above exercises on its permissive side, is corroborated by that case rather than tested against its refusing side by it or by anything else in this suite."

