milestone = "M2"
why = "The public cluster contract distinguishes `SentenceMedial` from `SentenceTerminator`. The medial choice is measured by 3.1.6/sentence-medial-role-opens-quarter-em-on-both-sides. The main-body sentence-final rule is measured independently by 3.1.6/sentence-terminator-inserts-one-em, while 3.1.6/sentence-terminator-space-is-withdrawn-at-wrap proves that the inserted em is not carried to the next line head. A following closing bracket remains the stated zero-space exception. The Note forbidding authors from appending a full stop changes caller content before shaping and is editorial rather than layout work."

