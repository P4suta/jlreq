[[owned]]
rule = "3.3.8"
milestone = "M1"
why = "Two different halves of this rule, and only one of them changed this round. `crates/jlreq-conform/cases/A.16.json` publishes `classify`-kind cases citing 3.3.8 as the reason cl-16 (katakana) is its own class rather than folded into cl-19 — §3.9.2's own Note: 'ルビのはみ出しがあった場合，平仮名と同様に掛かってよいとしたことから独立した文字クラスとした' — and that half was already attempted at M0, unaffected by anything here. The half this file's own sentence was actually about — rule 1's own prohibition, forbidding ruby from overhanging an adjacent cl-19 character and forcing the bases apart as natural advance instead (§3.3.1's note) — is genuinely attempted now: `jlreq_inline::lower` (M4-a round 1) computes it as `Contribution::separations` for `RubyStyle::MonoRuby`, with unit tests exercising a real, non-empty forced separation (`crates/jlreq-inline/src/lower.rs`), and, as of this round (M4-a round 2), two published `lower` cases exercise it too: `3.3.8/forced-separation/only-beside-ideographic-neighbors` measures existence and absence — a forced separation beside a cl-19 neighbor and none beside an equally oversized construct's own hiragana neighbor — under `standing: \"normative\"` and no asserted amount, and `3.3.8/forced-separation/even-split-by-remainder-policy` measures the even-split amount `docs/decisions/mono-ruby-separation-split.md` reads, under `standing: \"unstated\"` with both `adjustment.remainder` readings published, never asserted as JLReq's own requirement. What remains unattempted, and is not this round's claim either, is rules 2 through 6's own overhang *permissions* over kana, half-em spaces, inseparable characters and brackets (`Question::RUBY_OVERHANG_KANA`, `Question::RUBY_OVERHANG_INDENT`, both unfilled slots `jlreq_inline::lower`'s own module doc names). This entry once named that gap 'placement's own later work (task #78)'; task #78 has since shipped `jlreq_inline::place`, and that forward reference is falsified rather than resolved, in the identical sense this ledger's own §3.3.4 entry already states for a sibling forward reference to the same task. `place`'s own module doc states plainly that it omits the `overhang` parameter `docs/design/api-spine.md`'s sketch names, reading neither `Question::RUBY_OVERHANG_KANA` nor `Question::RUBY_OVERHANG_INDENT`; the one future reader of an `overhang` value it does name, task #81, is scoped to a different, still-unwritten `Question` for §3.3.5(c)'s own narrower katatsuki-with-overflow choice, not to either of these two."

[[owned]]
rule = "3.3.5"
milestone = "M4"
why = "Mono ruby positioning is two separate facts, and both are answered here now, one in full and one to the edge of what a policy `Question` lets it resolve — the identical scope limit this entry's own former text already argued, closed a second time rather than merely restated. §3.3.5's alignment question — nakatsuki (中付き) or katatsuki (肩付き) — is genuinely resolved: `jlreq_inline::lower` reads `Question::RUBY_ALIGNMENT` and honors a per-construct `Ruby::with_alignment` override regardless of direction (ADR-0019's precedence rule), which is why `docs/direction-sites.toml`'s own `[[site]]` entry for `jlreq_inline::lower` reads §3.3.5 rather than deferring it. `crates/jlreq-conform/cases/3.3.5.json` measures that resolution directly, as the `lower` kind (M4-a round 2): `3.3.5/ruby-alignment/policy-selects-nakatsuki-or-katatsuki` asserts both of `Question::RUBY_ALIGNMENT`'s choices against `Contribution::alignment_of`, and `3.3.5/katatsuki-in-horizontal-writing/discouraged-but-honored` asserts `Contribution::alignment_discouraged` against the section's own 'katatsuki... should not be adopted' recommendation in horizontal writing — honored and reported, never refused (ADR-0011), the fact that distinguishes a recommendation from a prohibition — while the resolved alignment stays katatsuki rather than being silently substituted. Both cases' own katatsuki-selecting `permitted` entries are now genuinely *exercised*, not only published and checked: as of this round (M4-a round 4), `crates/jlreq-conform/tests/suite.rs`'s own `section_3_3_5_is_also_measured_under_katatsuki` constructs a second `Kumihan::new(Policy)` declaring `ruby.alignment: katatsuki`, under which the runner's own selection rule (`crates/jlreq-conform/src/run.rs`'s own module doc) picks the katatsuki entry of every case in this file rather than `{}`, so the katatsuki reading is a real, checked agreement for this implementation and not only a statement published for another one (ADR 0006). `crates/jlreq-inline/src/lower.rs`'s own `katatsuki_is_honored_and_discouraged_only_in_horizontal_writing` unit test still exercises it directly too, against both writing directions.\n\nThe placement half moved from unimplemented (M4-a round 3's own former text) to implemented-and-cased (M4-a round 4): task #78 implemented `jlreq_inline::place`, which genuinely computes three of §3.3.5's four positioning cases — nakatsuki centering (§3.3.5(b) and, including a run genuinely longer than its base, §3.3.5(c)) and katatsuki start-alignment where the run is not longer than the base (§3.3.5(b)) — reading the alignment `lower` already resolved and consuming it rather than re-deriving it; and task #80 authored the `place` conformance kind as its own separately-authored phase (ADR-0006) and, at the time, four cases in `crates/jlreq-conform/cases/3.3.5.json` that measured it. What remains genuinely unresolved is narrower still, and a cased absence rather than an uncased one: §3.3.5(c)'s own katatsuki-with-overflow choice, which the section states two methods for in so many words but which no policy `Question` exists to choose between (`spec/derived/questions.tsv`'s own §3.3.5 neighborhood names five questions and none is this one); `place` declines such a run rather than picking on its own authority. Giving that choice a `Question` is task #81, deliberately a round of its own.\n\nThree of task #80's own four cases survive unchanged into this round (M4-a round 5): `3.3.5/mono-ruby-placement/one-character-nakatsuki-vs-katatsuki` (§3.3.5(b), the load-bearing pair — the same run, two resolved offsets), `3.3.5/mono-ruby-placement/two-characters-exactly-filling-the-base` (§3.3.5(a), the alignment-independent case), and `3.3.5/mono-ruby-placement/three-characters-longer-than-the-base` (§3.3.5(c), both its nakatsuki centering and its katatsuki-with-overflow decline, asserting the specific declined construct ordinal, not merely that nothing was placed). The fourth, `3.3.5/group-ruby-placement/produces-no-attachment-and-is-not-declined`, is deleted this round rather than retargeted: its own premise — that a `style: \"group\"` construct produces no `Attachment` under `jlreq_inline::place` at all — is exactly what this round's own §3.3.6 implementation falsifies. Its fixture (a 1000-unit base against two 500-unit ruby characters, surplus exactly zero) now yields two real attachments at offsets 0 and 500 under §3.3.6 paragraph 1's own arithmetic, so `attachments: []` stopped being true the moment `jlreq_inline::place`'s own group-ruby branch landed. Retargeting the case to a fixture that still asserts something about §3.3.5's own boundary with §3.3.6 would have meant authoring a new id, input and rationale inside that implementation round, which ADR-0006 reserves for the separately-authored case phase; task #85, §3.3.6's own conformance round, is where that promise is resolved, and it resolves to a decline rather than a replacement, verified against the code rather than assumed on the strength of the promise alone. When this promise was written (M4-a round 6, task #85), `crates/jlreq-inline/src/place.rs`'s own dispatch still held an empty `RubyStyle::JukugoRuby` arm, so a jukugo-shaped `place` case would have asserted `attachments: []` alongside `declined: []` — which passes for an implementation that never implemented anything at all, the exact §D.2#4 trap this project's own discipline refuses to publish as coverage (a case that would pass whether or not a mechanism was ever implemented measures nothing) — and the fact such a case would have asserted belonged, at the time, to §3.3.7's own deferral (jukugo positioning, `Question::JUKUGO_RUBY_LAYOUT`, §F), not to §3.3.5 or §3.3.6. Both halves of that reasoning are superseded now, not merely restated: task #88 (M4-a round 7) replaced the empty arm with `place_jukugo` and `place_jukugo_compound`, which do reach `place_mono_run` and `place_group_run` and do appear in `Attachments::declined`; and task #90 (M4-a round 8) authored real §3.3.7 cases against exactly that geometry and moved the rule to `[[owned]]` (this file's own entry below), so the fact such a case would have asserted no longer needs a hypothetical — §3.3.7's own entry is what cases it directly. No replacement is owed here regardless, for the narrower reason that still holds: retargeting `3.3.5.json`'s own deleted fourth case to a jukugo fixture would have meant authoring a §3.3.7 case inside this rule's own implementation round, which ADR-0006 reserves for §3.3.7's own separately-authored conformance phase — the phase task #90 later supplied. This rule stays `[[owned]]` on the strength of its own three surviving cases: the alignment question, cased and genuinely exercised under both readings; three of four positioning cases, cased; the fourth's own unresolved choice, cased as a decline. §3.3.5's own scope limit is otherwise unchanged, and task #81 is still what closes its remainder."

[[owned]]
rule = "3.3.6"
milestone = "M4"
why = "M4-a round 5 (task #84) implemented the geometry; this round (M4-a round 6, task #85) is the separately-authored conformance phase ADR-0006 requires before the rule can leave `[[deferred]]` on anything but the implementation's own word, and it is what actually moves it. `crates/jlreq-conform/cases/3.3.6.json` publishes four cases naming rule `3.3.6`: `3.3.6/group-ruby-placement/equal-length-both-methods-agree` measures paragraph 1 — the ratio at which `jis` and `flush` are not two readings but one, published as a single `permitted` entry rather than two identical ones, the same discipline `3.3.5/mono-ruby-placement/two-characters-exactly-filling-the-base` already established for its own sibling rule; `3.3.6/group-ruby-placement/jis-versus-flush-distribution` measures paragraph 2's own load-bearing divergence at four ruby characters over a two-item, Table-1-verified-blank base, every one of the run's four offsets differing between the two methods; `3.3.6/group-ruby-placement/single-ruby-character-jis-vs-flush` measures the same paragraph at the one ratio — exactly one ruby character — where `jis` is still directly derivable from the ratio sentence but `flush` is not, standing `unstated` and resting on `docs/decisions/group-ruby-flush-single-character.md`'s own published reading rather than on the section's own words alone; and `3.3.6/group-ruby-placement/ruby-longer-than-the-base-declines` measures paragraph 3, asserting `declined: [0]` rather than merely `attachments: []`, the identical specific-ordinal standard `3.3.5/mono-ruby-placement/three-characters-longer-than-the-base` already established for its own sibling decline.\n\nBoth of `Question::GROUP_RUBY_DISTRIBUTION`'s answers are genuinely *exercised*, not merely published: `crates/jlreq-conform/tests/suite.rs`'s own `section_3_3_6_is_also_measured_under_flush` constructs a second `Kumihan::new(Policy)` declaring `ruby.group_distribution: flush`, under which the runner's own selection rule (`crates/jlreq-conform/src/run.rs`'s own module doc) picks the `flush` entry of every case naming one rather than `{}`, so the `flush` reading is a real, checked agreement for this implementation and not only a statement published for another one — the identical shape `section_3_3_5_is_also_measured_under_katatsuki` already gives §3.3.5's own katatsuki entries. Both suite tests carry an identical `[4 attempted, 0 not attempted]` census, because `place()`'s own decline conditions — §3.3.5(c)'s katatsuki-with-overflow choice and §3.3.6 paragraph 3's ruby-longer-than-base half alike — are extent comparisons made before either alignment question is ever read, so no case here becomes unanswerable under either policy; only which permitted entry is selected moves.\n\nThe coverage claim rests on these four cases, not on the implementation alone: the same discipline that kept this rule `[[deferred]]` through M4-a round 5 despite `place_group_run` genuinely computing real geometry, on the strength of exactly the ADR-0006 separation this round now closes. The scope this entry owns is honestly narrower than the section's own three paragraphs, in two ways stated here rather than left for a reader to assume closed. First, paragraph 3 is cased as a decline, never implemented: both of its own stated methods spread the *base* characters apart rather than moving the ruby, which `jlreq_inline::place` cannot do at all — `placements` is already fixed by the time `place` runs, and the function emits `Attachment`s for annotation items only — so the correct future fix is `crate::lower::lower_group` emitting forced `Separation`s before composition ever sees the base run, exactly the mono-ruby analogue `collect_mono_separation` already performs for §3.3.8 rule 1, and a future round's work rather than this one's. Second, paragraph 2's own Note — a criterion capping the leading and trailing spacing at one to one-and-a-half ruby ems before the `jis` method 'might give a misleading appearance' — is cased nowhere in this file, and stays a declared slot in `crate::place`'s own module doc rather than an invented number: the Note states two thresholds in one parenthesis, not one, so closing it needs either a policy `Question` of its own naming both as answers or a `docs/decisions/` reading picking one, and neither exists yet; every fixture this file publishes keeps its own leading and trailing spacing comfortably under one ruby em specifically so no case's own geometry silently sits inside that unfilled criterion's own territory."

[[owned]]
rule = "3.3.7"
milestone = "M4"
why = "M4-a round 7 (task #88) implemented the geometry this rule states; this round (M4-a round 8, task #90) is the separately-authored conformance phase ADR-0006 requires before the rule can leave `[[deferred]]` on anything but the implementation's own word, and it is what actually moves it. `crates/jlreq-conform/cases/3.3.7.json` publishes three cases naming rule `3.3.7`: `3.3.7/jukugo-ruby-placement/paragraph-one-per-base-mono-delegation` and `3.3.7/jukugo-ruby-placement/paragraph-two-whole-compound-attachment` share the identical base ('亜亜', two cl-19 items) and the identical four-character reading, differing in exactly one declared field — how `runs` partitions the reading across the two base characters (2 and 2, against 1 and 3) — which is what isolates paragraph 1's own delegation from paragraph 2's own whole-compound attachment as a ruby-character *count* per base character, not the extent comparison §3.3.5(a)-through-(c)'s own three cases reduce to; and `3.3.7/jukugo-ruby-alignment/katatsuki-discouraged-carries-through-the-delegation` (a `lower` case) measures the one fact no `place` case can observe — `Contribution::alignment_discouraged` for a jukugo construct in horizontal writing, settled on the reading that paragraph 1's own wholesale delegation to §3.3.5's *method* carries its recommendation against katatsuki with it, not only its arithmetic.\n\nAll three of `Question::JUKUGO_RUBY_LAYOUT`'s, `Question::GROUP_RUBY_DISTRIBUTION`'s and `Question::RUBY_ALIGNMENT`'s readings this file publishes are genuinely *exercised*, not merely published: `crates/jlreq-conform/tests/suite.rs`'s own `section_3_3_7_is_also_measured_under_phonetic`, `section_3_3_7_is_also_measured_under_flush` and `section_3_3_7_is_also_measured_under_katatsuki` each construct a second `Kumihan::new(Policy)` declaring the relevant answer, under which the runner's own selection rule (`crates/jlreq-conform/src/run.rs`'s own module doc) picks the entry naming it rather than `{}`, so each reading is a real, checked agreement for this implementation and not only a statement published for another one — the identical shape `section_3_3_5_is_also_measured_under_katatsuki` and `section_3_3_6_is_also_measured_under_flush` already give their own sibling sections. The `flush`-naming entry publishes `decision:jukugo-group-layout-distribution`'s own forcing — a jukugo compound answering `group` yields `jis`'s own geometry regardless of `ruby.group_distribution` — as a named, contradicted expectation for any reader who assumes a jukugo compound tracks that question the way an ordinary group-ruby run does at the identical non-zero surplus (`3.3.6/group-ruby-placement/jis-versus-flush-distribution`'s own sibling case). Its own second run's own green result is not itself proof that entry was selected, unlike the `phonetic` run's — the file's own `{}` entry, matching every policy, already asserts the identical numbers, so a regression that let a jukugo compound read that question after all would still be caught by disagreement with the `{}` entry alone, which stays selected regardless of what the `flush`-naming entry adds. All four second runs (including the default) carry an identical `[3 attempted, 0 not attempted]` census, because none of `place`'s own decline conditions or `lower`'s own alignment resolution reads a policy this file's three cases do not already publish an entry for.\n\nThe coverage claim rests on these three cases, not on the implementation alone, the identical discipline that kept this rule `[[deferred]]` through M4-a round 7 despite `place_jukugo` and `place_jukugo_compound` genuinely computing real geometry. The scope this entry owns is honestly narrower than the rule's own two paragraphs, stated here rather than left for a reader to assume closed: §F entire (§F.1 through §F.4) stays unimplemented, and `Question::JUKUGO_RUBY_LAYOUT`'s own `phonetic` answer declines every compound it reaches unconditionally rather than reading any part of it — `3.3.7/jukugo-ruby-placement/paragraph-two-whole-compound-attachment`'s own second entry cases that decline, not a phonetic geometry, because none exists to case. Paragraph 2's own fourth sentence — the two-threshold overhang ceiling, 'a full character width (or one and a half times the full-width) of a ruby character,' the identical two-number shape §3.3.6's own Note already declines — stays a declared slot in `crate::place`'s own module doc rather than an invented number, and is doubly moot for this suite because it governs the `phonetic` method alone, which no case here reaches past the decline. `crate::lower::lower_jukugo` still emits no `Separation` for a jukugo compound's own surplus, the identical absence §3.3.6's own entry already states for group-ruby; both of this file's `place` cases state the fact explicitly in their own rationale rather than let the placements they derive imply it by coincidence. And a jukugo compound §C.2#8's own break permission has split across two lines still declines rather than placing a fragment, but this stays unit-test-only observable for this suite, not something this round hunted a fixture for: `crates/jlreq-conform/src/kumihan.rs`'s own `Compose::place` adapter always derives `items` as the case's own whole declared base stream, so no case published here, or ever publishable under this format, can construct the straddle at all."

