# The conformance deferral ledger: the inventoried rules whose conformance case a later
# milestone writes, each naming that milestone.
#
# CONTRIBUTING.md states that a rule without a case is incomplete, and
# docs/adr/0013-rules-are-addressed-by-specification-address.md makes that arithmetic: the
# `conform` gate subtracts the rules the cases declare from the rules the inventory names,
# and the `spec-links` gate subtracts them from the rules the layout core cites. The
# inventory is generated whole — spec/derived/rules.tsv names every rule of § 3 and of
# Appendices B through F at once — while the suite is written milestone by milestone. Both
# subtractions therefore have a remainder that is nothing but the schedule.
#
# Without this file a gate could only choose between two false sentences: that the rules
# are covered, by weakening the subtraction until the remainder disappeared, or that the
# workspace is broken, by failing over a milestone that has not happened yet. Neither is
# true, so a third state is written down instead. A rule is
#
#   covered   — a case in crates/jlreq-conform/cases names it, or a `covers` family credits
#               it; or
#   deferred       — a `[[deferred]]` table names it and the milestone that will cover it;
#   editorial      — an evidence-bearing `[[editorial]]` table shows that it advises an
#                    editor rather than requiring observable layout output;
#   non-observable — an evidence-bearing `[[non-observable]]` table shows that the protocol
#                    cannot distinguish a required answer because JLReq leaves it open; or
#   uncovered      — none of these, which fails `conform` and names the rule.
#
# Deferred is not exempt. Every `conform` run prints the count of deferred rules and the
# count per milestone, so the debt is stated in numbers on a green run, and `spec-links`
# reports how many of the cited rules it passed over for this reason. The entry expires by
# itself: the moment any case names the rule, the rule is covered and the entry is a
# violation, because a deferral that outlived its milestone is a claim about the future
# that the present has already answered. Deleting the entry is the reviewable act that says
# the rule now has a case; nothing is switched on by hand.
#
# The other half of the subtraction is written here too, because a schedule with only one
# direction is not an accounting. A `[[deferred]]` table says which milestone *will* cover a
# rule; an `[[owned]]` table says which milestone's cases already *do*, and it is held to the
# opposite invariant — the rule must be covered now, and it must not be deferred by anything.
# Until M0-b the rules M0 answers were named in this header and nowhere a gate could read, so
# one of them could be dropped from the cases and given a `[[deferred]]` entry naming a later
# milestone with every gate staying green; that is measured and closed. `conform` also fails
# a rule a case covers that no `[[owned]]` entry names, so a case cannot credit a rule to
# nobody — which is the route a `kind: "boundary"` case took, published for a layer that
# answers nothing yet and crediting its rules to the coverage gate with no reviewer in the
# path. Both routes now end at the same file, the same `milestone` and the same `why`.
#
# Schema. One `[[deferred]]`, `[[owned]]`, `[[editorial]]`, or `[[non-observable]]` table
# per rule. `deferred` and `owned` use all three keys; final classifications omit
# `milestone` because they are not implementation work scheduled for later:
#
#   rule       The specification address of an inventoried rule, in the canonical rendering
#              of `jlreq_spec::Address` — `3.1.9`, `B.2#3`, `B.1@cl-05,cl-05` — with no
#              section sign. One table per rule across both tables, and the address must be
#              one spec/derived/rules.tsv carries: deferring a rule the inventory does not
#              name defers nothing.
#   milestone  (`deferred`/`owned` only.) The milestone whose conformance cases close it, or have closed it, spelled as
#              ROADMAP.md heads it: `M0` through `M6`. ROADMAP.md is what a milestone *is*;
#              this file only names one, and `conform` rejects a name that document does not
#              declare. On an `[[owned]]` entry it names the milestone whose *layer* answers
#              the rule, which is not always the milestone that wrote the case: a boundary
#              case published at M0-b for a rule `jlreq-spacing` answers at M1 is covered
#              now and attempted by nothing, and the entry says both.
#   why        Which answer the rule states and which crate produces it, in a sentence a
#              reviewer can disagree with. On an `[[owned]]` entry whose cases no layer of
#              this workspace answers yet, it says that too, because a published case that is
#              never attempted is a statement to another implementation rather than a
#              measurement of this one.
#
# The assignment below follows one principle, so that disagreeing with an entry is
# disagreeing with something: a rule is deferred to the milestone that builds the crate
# whose answer the rule states. Line breaking, line adjustment, indents and tab positions
# are `jlreq-line` and arrive at M1, together with Appendices C, D and E, which are the
# tables that layer reads. Inter-character spacing amounts are `jlreq-spacing` and arrive at
# M2, together with Appendix B. A whole-paragraph decision arrives at M3, the nine inline
# constructs and Appendix F at M4, and a rule whose subject exists only in vertical
# composition at M5.
#
# The rules M0 answers are not deferred; they are recorded under `[[owned]]` at the foot of
# this file, which is where the sentence that used to sit here became something a gate can
# read. § 3.9.1 and § 3.9.2 state the classification itself; § C.3, § C.2 notes 1 to 3,
# § B.2 notes 14 to 16 and § E.2 notes 1 to 3 state the class an occurrence at a line head is
# treated as belonging to, which is the reclassification `jlreq-class` answers; § 3.1.2,
# § 3.2.4 and § 3.2.6 are the three sentences outside Appendix A that a declared frame fires,
# and M0-b's cases declare them where their own rationale already argued from them. If a case
# for one of them is deleted, the `[[owned]]` entry is what fails.
#
# § 3.9.3 was in that list until M0-b read it against the document and found it is not a
# classification rule at all: what it states is that line-head and line-end permission, the
# positioning method there, and the amount between two adjacent characters are all indexed
# by the pair of classes in a two-dimensional table. No classification case can reach it, so
# it is deferred below to the milestone that builds the first of those matrices.
#
# What this file cannot check is named rather than glossed. Nothing here reads which
# milestone the workspace is writing, so an entry naming a milestone already under way is
# not a violation; what makes such an entry visible is the per-milestone census on every
# run, and what ends it is a case. And no gate can know that the milestone named is the
# right one — that is the reviewer's judgment, which is what `why` is for and why this file
# is owned by the code owners in .github/CODEOWNERS.
#
# The order is the inventory's own: § 3 in section order, then the appendix sections, then
# the appendix notes, so this file and spec/derived/rules.tsv can be read side by side.

