# The conformance deferral ledger: the inventoried rules whose conformance case a later
# milestone writes, each naming that milestone.
#
# CONTRIBUTING.md states that a rule without a case is incomplete, and
# docs/adr/0013-rules-are-addressed-by-specification-address.md makes that arithmetic: the
# `conform` gate subtracts the rules the cases declare from the rules the inventory names,
# and the protocol coverage pass checks every observable rule directly. The
# inventory is generated whole — spec/derived/rules.tsv names every rule of § 3 and of
# Appendices B through F at once — while the suite is written milestone by milestone. Both
# subtractions therefore have a remainder that is nothing but the schedule.
#
# Without this file a gate could only choose between two false sentences: that the rules
# are covered, by weakening the subtraction until the remainder disappeared, or that the
# workspace is broken, by failing over a milestone that has not happened yet. Neither is
# true, so a third state is written down instead. A rule is
#
#   covered   — a case in crates/jlreq-conformance/suite.ndjson names it;
#   deferred       — a `[[deferred]]` table names it and the milestone that will cover it;
#   editorial      — an evidence-bearing `[[editorial]]` table shows that it advises an
#                    editor rather than requiring observable layout output;
#   non-observable — an evidence-bearing `[[non-observable]]` table shows that the protocol
#                    cannot distinguish a required answer because JLReq leaves it open; or
#   uncovered      — none of these, which fails `conform` and names the rule.
#
# Deferred is not exempt. Every `conform` run prints the count of deferred rules and the
# count per milestone, so the debt is stated in numbers on a green run. The entry expires by
# itself: the moment any case names the rule, the rule is covered and the entry is a
# violation, because a deferral that outlived its milestone is a claim about the future
# that the present has already answered. Deleting the entry is the reviewable act that says
# the rule now has a case; nothing is switched on by hand.
#
# The other half of the subtraction is written here too, because a schedule with only one
# direction is not an accounting. A `[[deferred]]` table says which milestone *will* cover a
# rule; an `[[owned]]` table says which milestone's cases already *do*, and it is held to the
# opposite invariant — the rule must be covered now, and it must not be deferred by anything.
# Until M0-b the rules M0 answers were named in this header and nowhere a gate could read, so
# one of them could be dropped from the cases and given a `[[deferred]]` entry naming a later
# milestone with every gate staying green; that is measured and closed. `conform` also fails
# a rule a case covers that no `[[owned]]` entry names, so a case cannot credit a rule to
# nobody — which is the route a `kind: "boundary"` case took, published for a layer that
# answers nothing yet and crediting its rules to the coverage gate with no reviewer in the
# path. Both routes now end at the same file, the same `milestone` and the same `why`.
#
# Schema. One `[[deferred]]`, `[[owned]]`, `[[editorial]]`, or `[[non-observable]]` table
# per rule. `deferred` and `owned` use all three keys; final classifications omit
# `milestone` because they are not implementation work scheduled for later:
#
#   rule       The specification address of an inventoried rule, in the canonical rendering
#              of the address grammar — `3.1.9`, `B.2#3`, `B.1@cl-05,cl-05` — with no
#              section sign. One table per rule across both tables, and the address must be
#              one spec/derived/rules.tsv carries: deferring a rule the inventory does not
#              name defers nothing.
#   milestone  (`deferred`/`owned` only.) The milestone whose conformance cases close it, or have closed it, spelled as
#              ROADMAP.md heads it: `M0` through `M6`. ROADMAP.md is what a milestone *is*;
#              this file only names one, and `conform` rejects a name that document does not
#              declare. On an `[[owned]]` entry it names the milestone whose *layer* answers
#              the rule, which is not always the milestone that wrote the case: a boundary
#   why        Which observable answer the rule states and which private pipeline behavior
#              produces it, in a sentence a
#              reviewer can disagree with. A final `[[editorial]]` or `[[non-observable]]`
#              classification must cite `spec/snapshot/index.html`, the vendored primary
#              text the gate requires a reviewer to be able to inspect. On an `[[owned]]`
#              entry, `why` records the historical ownership decision and the observable
#              behavior now exercised through protocol v1.
#
# The milestone assignments are stable history: M0 classified specification data, M1
# handled breaking and adjustment, M2 spacing, M3 whole-paragraph composition, M4 inline
# constructs and Appendix F, and M5 vertical composition. All are now private stages of
# the unified pipeline; the headings remain in ROADMAP.md so the ledger keys stay stable.
#
# The rules M0 answers are not deferred; they are recorded under `[[owned]]` at the foot of
# this file, which is where the sentence that used to sit here became something a gate can
# read. § 3.9.1 and § 3.9.2 state the classification itself; § C.3, § C.2 notes 1 to 3,
# § B.2 notes 14 to 16 and § E.2 notes 1 to 3 state the class an occurrence at a line head is
# treated as belonging to, which is the private classifier's answer; § 3.1.2,
# § 3.2.4 and § 3.2.6 are the three sentences outside Appendix A that a declared frame fires,
# and M0-b's cases declare them where their own rationale already argued from them. If a case
# for one of them is deleted, the `[[owned]]` entry is what fails.
#
# § 3.9.3 was in that list until M0-b read it against the document and found it is not a
# classification rule at all. Its matrix statements are now classified below as
# non-observable independently of the concrete Appendix B through E cells they introduce.
#
# What this file cannot check is named rather than glossed. Nothing here reads which
# milestone the workspace is writing, so an entry naming a milestone already under way is
# not a violation; what makes such an entry visible is the per-milestone census on every
# run, and what ends it is a case. And no gate can know that the milestone named is the
# right one — that is the reviewer's judgment, which is what `why` is for and why this file
# is owned by the code owners in .github/CODEOWNERS.
#
# The order is the inventory's own: § 3 in section order, then the appendix sections, then
# the appendix notes, so this file and spec/derived/rules.tsv can be read side by side.

[[editorial]]
rule = "3.1.1"
why = "The primary text at spec/snapshot/index.html, §3.1.1 Differences in Vertical and Horizontal Composition in Use of Punctuation Marks, describes which source characters an editor may choose: IDEOGRAPHIC FULL STOP and IDEOGRAPHIC COMMA in vertical text; three alternative comma/full-stop conventions in horizontal text; corner brackets versus quotation marks; vertical-only double-prime quotation marks; and direction-specific iteration marks. It states no spacing, break, adjustment, transform, or placement result for a supplied character. The black-box protocol receives the caller's already-chosen UTF-8 string and shaped clusters, while font choice, shaping, and authoring are permanently outside jlreq's scope. Rejecting or rewriting one of the listed characters would turn usage guidance into an engine requirement the section does not state. Direction-dependent glyph treatment of Western punctuation, when a caller has chosen it, is covered mechanically by §§3.2.3 and 3.2.5 rather than by crediting this source-selection section twice."

[[owned]]
rule = "3.1.3"
milestone = "M5"
why = "The unified pipeline ports the already-tested role distinction into the public shaped-cluster contract and makes the result observable as geometry. A normal IDEOGRAPHIC COMMA contributes its following half em and a normal KATAKANA MIDDLE DOT contributes a quarter em on each side; in vertical-rl, DigitGroupSeparator withdraws the comma contribution and DecimalPoint withdraws both middle-dot contributions. Protocol-v1 cases 3.1.3/vertical-digit-group-comma-withdraws-half-em and 3.1.3/vertical-decimal-middle-dot-withdraws-quarter-ems each place an exceptional and an ordinary occurrence in one response so zero cannot pass by an implementation that never supplied the normal spacing. Case 3.1.3/decimal-middle-dot-exception-is-vertical-only fixes the main lists direction condition. The closing Note has a recorded locale defect in spec/derived/defects.tsv: its English half says vertical and its Japanese half says horizontal for unit-symbol, grouped-numeral, and formula middle dots. Both halves state only a positive solid-setting requirement and neither requires spacing in the other direction, so the implementation takes their non-conflicting union and suppresses those three role-scoped contributions in both modes; 3.1.3/construct-middle-dots-are-solid-in-locale-union measures all three roles through an external process. Caller-shaped advances remain untouched; only the JLReq boundary contribution is withdrawn."

[[editorial]]
rule = "3.2.1"
why = "The primary text at spec/snapshot/index.html, §3.2.1 Composition of Japanese and Western Mixed Texts, enumerates authoring examples — a Latin symbol, a Western word, an acronym, a Western title, whole quoted paragraphs, and choosing katakana unit names in vertical text versus SI spellings in horizontal text — but states no spacing, break, adjustment, or placement result. Those choices change the source string before shaping; the black-box protocol intentionally receives that already-chosen string and cannot decide whether an author should have written センチメートル or cm. Its final Note merely points readers to JIS X 4051 4.7. The one engine fact suggested by the examples, that proportional Western characters are cl-27, is stated mechanically by §3.2.6 and already covered there. A duplicate case crediting §3.2.1 would therefore test §3.2.6 again, while an engine that rewrote the caller's content would exceed jlreq's scope. This rule is editorial input guidance, not deferred layout work."

[[owned]]
rule = "3.2.3"
milestone = "M5"
why = "The unified placement view exposes all three methods §3.2.3 enumerates for Western text in vertical composition without owning font selection or shaping: a full-em cluster stays upright in vertical-rl, proportional Western clusters carry the rotate-clockwise transform, and an explicitly declared tate-chu-yoko range switches to horizontal-tb with the tate-chu-yoko transform. Protocol-v1 cases 3.2.3/vertical-full-em-western-upright, 3.2.3/vertical-proportional-western-rotated, and 3.2.3/vertical-two-digits-tate-chu-yoko measure those three results through an external process; vertical_western_text_exposes_upright_rotated_and_tate_chu_yoko_methods independently fixes the Rust view. The caller still chooses the already-shaped font/frame and whether a range is tate-chu-yoko, matching jlreq's declared boundary around shaping and authoring rather than guessing from source characters. Detailed solid-setting geometry and punctuation spacing for the third method are covered separately by §3.2.5."

[[owned]]
rule = "3.2.5"
milestone = "M4"
why = "The unified pipeline treats an explicitly declared vertical tate-chu-yoko range as one indivisible logical line item while retaining every caller-shaped cluster for drawing: member advances remain horizontal and solid, all members share the group's vertical inline origin, their block coordinates advance left-to-right from the centered group edge, the group's vertical consumption is its largest local block size, and a run wider than the line's ordinary em widens the line's physical block demand. 3.2.5/tate-chu-yoko-solid-centered-group measures that geometry and solid ideographic neighbors; 3.2.5/tate-chu-yoko-hiragana-katakana-neighbors-solid measures the other two neighbor classes named by the text. The four directional punctuation clauses are all distinguished rather than generalized: 3.2.5/tate-chu-yoko-half-em-punctuation-boundaries measures a closing bracket before and an opening bracket after the group, 3.2.5/tate-chu-yoko-full-stop-and-comma-before-half-em measures the remaining full-stop and comma predecessors while also observing the reverse comma boundary as solid, and 3.2.5/tate-chu-yoko-reverse-punctuation-boundaries-solid measures the reverse opening/closing pair. 3.2.5/tate-chu-yoko-full-stop-at-line-end-keeps-half-em forces the break between a full stop and its following group and observes that the half em remains on the preceding line. The public tests tate_chu_yoko_is_one_centered_solid_item_in_a_vertical_line and tate_chu_yoko_punctuation_boundaries_follow_the_directional_half_em_rules additionally pin justification, mixed group width, all eight punctuation directions, and line-to-line block progression. Font choice and shaping remain caller inputs, as the architecture requires."

[[owned]]
rule = "3.3.1"
milestone = "M4"
why = "The unified Ruby input and placement pipeline now preserves the section's three mechanically distinct relationships instead of treating RubyKind as metadata: mono runs are positioned against each declared base run, group ruby is positioned whole-to-whole and ParagraphBuilder rejects an interior break, and jukugo keeps its per-base run associations while permitting a break at a declared run boundary and placing only the annotation fragment belonging to each resulting line. Protocol-v1 cases 3.3.1/mono-ruby-preserves-per-base-associations, 3.3.1/group-ruby-preserves-whole-word-association, and 3.3.1/jukugo-ruby-splits-only-at-run-boundary distinguish those outputs. The section's own Note states a second observable difference: line adjustment may expand the base boundary between mono-ruby characters but not one inside a jukugo compound; 3.3.1/mono-ruby-internal-boundary-expands and 3.3.1/jukugo-ruby-internal-boundary-does-not-expand exercise the two sides through an external process, while ruby_kinds_preserve_base_associations_and_break_semantics also checks group rigidity and the stable InputError for its forbidden break. The physical right/above side is owned by §3.3.4, and the detailed placement arithmetic and phonetic method are owned or deferred under §§3.3.5–3.3.7 and Appendix F rather than duplicated here. The remaining passages in spec/snapshot/index.html §3.3.1 describe editorial purposes, frequency, vocabulary, and choices of which meaning or reading to annotate; they alter the Ruby, RubyKind, and RubyRun inputs the caller supplies but state no additional layout result for the engine to infer."

[[editorial]]
rule = "3.3.2"
why = "Read against the specification's own words (spec/snapshot/index.html, the second 'Choice of Base Characters to be Annotated by Ruby' section) rather than against what this crate happens to compute, this rule is not about lowering at all, and the blocker its own former entry named — that no conformance kind observed a `Contribution` — is retracted rather than merely closed now that `lower` cases exist (task #74), because closing it would not have reached this rule regardless. §3.3.2's body states three editorial methods an author chooses among before ever declaring a `Ruby` — general-ruby (総ルビ, annotating every cl-19 occurrence), para-ruby (パラルビ, annotating only the difficult ones), and para-ruby's own further split between annotating every occurrence and only the first, itself subdivided by whether 'first' is counted per book, per chapter, or per spread — plus a closing recommendation that a compound word (熟語) should receive ruby on *all* its cl-19 characters rather than only some, illustrated by Figure 113's own contrast of a recommended and a not-recommended layout. Every one of the first three is a choice the caller makes before calling `Ruby::new` at all: `Constructs::with_ruby`'s own input is `base` already chosen, and no fact upstream of that choice is `jlreq_inline::lower`'s to compute or a `Contribution` to report — a `lower` case could only ever observe the *consequence* of an editorial choice already made, never adjudicate whether the caller made the recommended one. The closing sentence is likewise explicit editorial guidance: it says that partial ruby on a compound is “not recommended” / 望ましくない, not that a layout engine must reject, reposition, or diagnose it. Inventing a future layout diagnostic would turn advice into an engine requirement JLReq does not state. The rule is therefore `[[editorial]]`, with no empty conformance case and no implementation milestone."

[[non-observable]]
rule = "3.3.3"
why = "The primary text at spec/snapshot/index.html, §3.3.3 Choice of Size for Ruby Characters, says half the base size only 'in principle', then explicitly permits anisotropic one-third ruby, generally smaller-than-half ruby for headings at twelve points or more, half-size ruby for some twelve-point body text, and replacing ruby with another annotation method when the base is very small. These choices require font point size, document role, audience, and glyph legibility, none of which the layout protocol observes. More fundamentally, the public contract receives the annotation as an already-shaped ShapedText whose Size, per-cluster size overrides, and advances the caller has already selected are mandatory input; font selection and shaping are permanently out of scope. A case supplying a half-size annotation and seeing that same size in Attachment would pass an engine that never read §3.3.3 and merely preserved caller metrics, while a case supplying one-third or smaller ruby could be equally valid under the section's own alternatives. The protocol therefore has no unchosen size whose required value can distinguish implementation of this rule, so it is non-observable rather than unfinished placement work."

[[owned]]
rule = "3.3.4"
milestone = "M4"
why = "The unified jlreq placement stage now makes the section's principal physical-side rule observable in caller coordinates: ruby attachments are above their base in horizontal-tb and to its right in vertical-rl, and line progression reserves the largest actual annotation size. Protocol-v1 cases 3.3.4/ruby-above-horizontal-mixed-size and 3.3.4/ruby-right-vertical-mixed-size measure both directions through an external process with unequal annotation sizes; ruby_is_on_block_start_and_reserves_the_largest_annotation_size independently measures the public Rust view. The primary text at spec/snapshot/index.html calls left/below and dual-sided ruby very rare special examples, while its closing paragraph explicitly fixes right/above as the assumption for the composition rules that follow; this ownership covers that stated principal behavior and does not invent a style choice absent from the document's 22 machine-derived questions."

[[owned]]
rule = "3.4.1"
milestone = "M4"
why = "The unified paragraph pipeline lowers a declared warichu range into one logical inline item whose caller-shaped interior is split over two balanced sublines. Protocol-v1 cases 3.4.1/warichu-two-balanced-sublines-horizontal and 3.4.1/warichu-two-balanced-sublines-vertical distinguish both physical writing modes: opening and closing brackets remain on the main line, both small-character lanes share one inline measure with zero block gap, and vertical-rl reverses the second lane along the block axis without changing its logical inline order. The public Rust acceptance test warichu_builds_two_balanced_sublines_and_can_straddle_main_lines independently pins the same read-only placement view."


[[owned]]
rule = "3.4.3"
milestone = "M4"
why = "Long warichu participate in the same whole-paragraph dynamic program as ordinary clusters. A declared internal opportunity may become a main-line break; each resulting segment is balanced independently, the opening and closing brackets stay with the outer segments, and every original shaped cluster is emitted exactly once. Protocol-v1 case 3.4.3/warichu-straddles-balanced-main-lines forces a ten-cluster note over two equal main-line segments, while the public Rust acceptance test verifies the ranges and original-source order."

[[owned]]
rule = "3.7.2"
milestone = "M4"
why = "The opaque furawake construct now carries the section's required subline count and caller-selected block-axis line gap, while paragraph break offsets strictly inside its range declare the exact subline boundaries. The builder rejects a missing or surplus split, and those offsets are consumed by construct lowering rather than exposed to the outer paragraph search, enforcing the prohibition on straddling main-text lines. Protocol-v1 cases 3.7.2/furawake-declared-sublines-horizontal and 3.7.2/furawake-declared-sublines-vertical measure the shared inline start, longest-subline logical advance, explicit 200-unit gap, centered 2200-unit block demand, and both physical writing directions. Character size and optional surrounding brackets remain caller-shaped inputs as the section requires."

[[owned]]
rule = "3.7.4"
milestone = "M4"
why = "The formula construct now applies the machine-observable principal method throughout the unified pipeline. Appendix A cl-17 math symbols and cl-18 operators consume one local em regardless of their supplied glyph advance. Inline formula interiors are solid, while proportional or grouped-numeral endpoints receive quarter-em boundaries against Japanese text. A formula occupying the complete paragraph uses quarter-em spacing on both sides of cl-17 and solid spacing beside cl-18; declared breaks are accepted only adjacent to those tokens, actual line breaks discard the crossed spacing, and the paragraph optimizer prefers a feasible break before cl-17 over one before cl-18. Protocol-v1 cases 3.7.4/inline-formula-full-em-symbol-and-outer-quarter-ems, 3.7.4/display-formula-equality-quarter-em-operator-solid, and 3.7.4/display-formula-prefers-break-before-equality distinguish these results. The section explicitly excludes fractions, roots, integrals, summations, and general mathematical notation; its alternative display-spacing methods and common alignment examples have no corresponding choice among JLReq 2020's 22 derived settings and are not invented as public knobs."

[[non-observable]]
rule = "3.9.3"
why = "The primary text at spec/snapshot/index.html, §3.9.3 Positioning Methods for each Character Class, explains that line-edge permission, adjacent spacing, breakability, reduction, and expansion can be described in two-dimensional class-pair tables, then delegates the concrete answers to Appendices B, C, D, and E. A black-box layout can observe every delegated cell, and those cells have their own inventoried addresses and cases, but it cannot distinguish an implementation that indexes a two-dimensional table from one that computes identical results with match expressions, generated code, or another equivalent representation. The section's Notes about how JIS X 4051 prints X marks and separates line-head and line-end rows likewise prescribe documentation shape, not output. No case can uniquely observe this introductory representation statement without merely duplicating an Appendix rule, so it is non-observable rather than unfinished matrix implementation."

[[owned]]
rule = "F"
milestone = "M4"
why = "The unified pipeline reads the typed JukugoRubyLayout::Phonetic answer and the caller-declared RubyRun associations directly, so Appendix F is now observable without exposing any lowering representation. Protocol-v1 cases F.1/two-or-fewer-stay-with-base, F.2/following-overhang-precedes-expansion, F.3/expansion-is-proportional-to-reading-length, and F.4/four-ruby-run-expands-only-eligible-base exercise the katatsuki vertical-writing premise through only the versioned request and placement response. The retained legacy jlreq-inline decline remains migration history; it is not in the public jlreq call path."

[[owned]]
rule = "F.1"
milestone = "M4"
why = "F.1/two-or-fewer-stay-with-base distinguishes phonetic association from whole-compound placement: one ruby character stays katatsuki on the first base and two stay on the second at inline coordinates 1000 and 1500. F.2/following-overhang-precedes-expansion additionally observes the one-ruby-em internal ceiling and the §3.3.8 neighbor permission selected by the typed style."

[[owned]]
rule = "F.2"
milestone = "M4"
why = "The phonetic constraint solver preserves annotation order while trying each run at its own base start, allows at most one local ruby em over the adjacent base, prefers the following side, and solves backward when only the preceding external character permits overhang. F.2/following-overhang-precedes-expansion observes the preferred forward path in vertical writing; the public phonetic_jukugo_follows_runs_before_expanding_eligible_base_gaps test also fixes the backward fallback and proves that neither path inserts base spacing while overhang suffices."

[[owned]]
rule = "F.3"
milestone = "M4"
why = "Only runs carrying more than two annotation clusters enter the expansion pool. The pipeline finds the smallest integer expansion after exhausting internal and permitted external overhang, apportions it by solid annotation length, splits each assigned amount before and after the eligible base using the typed remainder direction, and feeds those exact gaps into paragraph search, tab measurement, base placement, and attachment placement. F.3/expansion-is-proportional-to-reading-length observes a 3:4 allocation, including the leading integer remainder. The public acceptance test also fixes the line-head all-after and line-end all-before exceptions in both writing modes."

[[owned]]
rule = "F.4"
milestone = "M4"
why = "F.4/four-ruby-run-expands-only-eligible-base reproduces the appendix's four-ruby-character shape: the one-character run remains ineligible, the four-character run receives the remaining one-ruby-character expansion, and its two boundaries each gain a quarter base em. The response exposes advances 1250 and 1250, base coordinates 1000 and 2250, and five contiguous ruby placements, so an implementation that merely centers the whole compound cannot pass."

[[owned]]
rule = "B.2#1"
milestone = "M4"
why = "The integrated overhang budget recognizes a preceding cl-01 opening bracket as JLReq's preferred full-ruby-em permission instead of treating it as cl-19. Protocol-v1 case B.2-note-1/opening-bracket-allows-ruby-overhang places 1500 units of ruby over a 1000-unit base: the annotation begins at 750 and overlaps the bracket by 250, while the forbidden trailing ideographic overlap becomes 250 units of base separation. The result is observed through the versioned process protocol, including both base and annotation coordinates."

[[owned]]
rule = "B.2#8"
milestone = "M4"
why = "Protocol-v1 case B.2-note-8/ideographic-space-allows-ruby-overhang distinguishes cl-14 from a visually equal cl-19 neighbor: the long annotation overlaps the ideographic space by 250 units without moving its base. The two paragraph-indent cases exercise both typed answers to ruby.overhang_indent on identical input. The preferred profile keeps the base at the declared 1000-unit indent and lets ruby begin at 750; the prohibited answer adds a 250-unit leading separation, moving the base to 1250 and the annotation to 1000."

[[owned]]
rule = "B.2#9"
milestone = "M4"
why = "The unified pipeline resolves cl-21 membership from each opaque Script construct before adjustment. Protocol-v1 case B.2-note-9/ornamented-complex-run-aware-expansion puts two bases inside one Script and the following base in a distinct Script: the first boundary stays solid under justification, while the distinct-run boundary receives the third-order quarter-em opportunity before the following residual boundary. Its attachment coordinates also distinguish whole-complex placement from two unrelated annotations."


[[owned]]
rule = "B.2#11"
milestone = "M4"
why = "Jukugo Ruby constructs now retain one private complex identity across all of their base runs while adjacent Jukugo constructs receive distinct identities. Protocol-v1 case B.2-note-11/jukugo-ruby-complex-run-aware-expansion observes solid base placement inside one compound, a quarter-em adjustment only at the boundary to the next compound, and per-run annotation attachments from the same black-box response."

[[owned]]
rule = "B.2#13"
milestone = "M4"
why = "The unified pipeline now measures the note's supplied-advance suppression in both scopes it names. Protocol-v1 cases 3.2.2/western-word-space-collapses-at-line-edges and 3.2.2/western-word-space-restores-supplied-interior-width distinguish zero advance at actual paragraph-line edges from the caller-supplied width in an interior position. B.2-note-13/warichu-word-spaces-collapse-at-subline-edges applies the same rule independently to the head and end of each balanced warichu subline: all three edge spaces have zero placement advance while both interior letters retain their metrics. Justification explicitly excludes suppressed spaces, so adjustment cannot reopen them."

[[owned]]
rule = "D.2#4"
milestone = "M4"
why = "The observable consequence of this reduction note is now checked at every position where the corresponding visible Western word space is absent. Protocol-v1 cases 3.2.2/western-word-space-collapses-at-line-edges and B.2-note-13/warichu-word-spaces-collapse-at-subline-edges report zero cluster advance at main-line and warichu-subline edges respectively, so there is no residual width for the reduction ladder to remove; the public word-space and warichu acceptance tests also verify that paragraph justification does not recreate such width."

[[owned]]
rule = "E.2#5"
milestone = "M4"
why = "The integrated composer, rather than the construct-blind legacy boundary adapter, now supplies the run identity this note requires. B.2-note-9/ornamented-complex-run-aware-expansion holds four full-em bases on a justified non-final line with 250 units left: the boundary inside one Script remains at 1000, the boundary between two Script constructs advances from 2000 to 2250, and the later residual boundary receives nothing. This simultaneously observes the third-order precedence, the quarter-em ceiling at the amount exercised, and the same-run withdrawal through the versioned process protocol."

[[owned]]
rule = "E.2#6"
milestone = "M4"
why = "Simple-ruby identity is now computed inside the integrated composer: a Group Ruby is one complex, and each Mono Ruby association is a distinct simple-ruby complex even when several associations share one public Ruby value. Protocol-v1 case E.2-note-6/simple-ruby-complex-run-aware-expansion places two bases under one Group Ruby followed by a separate Group Ruby and a residual boundary. Only the different-complex boundary receives the available 250 units; the public acceptance test independently checks that two Mono runs take the same distinct-complex path."

[[owned]]
rule = "E.2#7"
milestone = "M4"
why = "The new paragraph pipeline carries one Jukugo complex identity across every RubyRun in a compound and a new identity for the next Jukugo construct. Protocol-v1 case B.2-note-11/jukugo-ruby-complex-run-aware-expansion therefore keeps the first internal base boundary solid, assigns all 250 available units to the following different-compound boundary at stage three, and leaves the residual boundary untouched. The response includes both base placements and annotation attachments, so the result is checked entirely through the black-box contract."

[[non-observable]]
rule = "E.2#11"
why = "The note offers an alternative way to give a fourth order expansion opportunity between two Western characters, but — unlike E.2#8's and E.2#9's own alternatives, each of which states a concrete ceiling (E.2#9's own words: 'to take up to a maximum of a quarter em space') — it states no ceiling at all: 'fourth order' is §3.8.4 step (d)'s own residual stage, the one `Expansion::Residual` represents, open-ended by definition rather than merely uncaptured. That distinction is what this round's decision turns on, not reachability, which is no longer the blocker (ADR-0021). Table 6's own cl-27-against-cl-27 cell states `limit: None` as its own captured default, confirmed directly against `spec/captured/table6.en.tsv`'s own reconciliation note, which records that 'note 11 -- on a *white* cell -- offers \"an alternative way to give a fourth order opportunity\" only as a deviation from the table's own default reading of \"blank\"' — the blank cell is what the source PDF's own fill color states, not a placeholder standing in for an unresolved note. `Boundary::expansion_rule()` reads `Some(RuleId::E_2_NOTE_11)` at this coordinate regardless of that default (ADR-0021's own amendment, 2026-08-09), and no question in `spec/derived/questions.tsv` is addressed to `E.2#11` (checked directly).\n\nThe classification decision: no case is authored, and this rule is `[[non-observable]]` because the cited provision leaves no single required black-box result. §3.8.4 step (d)'s own Note — the only other place in the document that discusses a fourth-order opportunity at this identical class pair, naming 'the spacing between Western characters (cl-27)' explicitly — attributes the residual expansion this coordinate would carry to a JIS X 4051 provision that JIS itself calls 処理系定義 (implementation-defined): 'it depends on each layout processing system whether inter-character spacing should be added equally. This includes the spacing between Western characters (cl-27)' (spec/snapshot/index.html, the Note under §3.8.4 item (d), id 'n173'). This connection is an inference from coordinate coincidence rather than a citation E.2 note 11's own sentence states directly — note 11's own text (spec/snapshot/index.html, list item id668) reads exactly as concretely as note 9's, 'There is an alternative way to give a fourth order opportunity...', with no reference to JIS X 4051 or to any standard's own discretion — but step (d)'s Note is the only sentence anywhere in JLReq that discusses a residual, fourth-stage opportunity at cl-27-against-cl-27, and it is explicit that the specification JLReq is itself built on treats the question as outside its own scope to answer, for exactly this class pair. A case asserting `expansion: { kind: \"none\", rule: \"E.2#11\" }` would consequently not be making the same kind of claim the cases under `E.2#8` and `E.2#9` above make: those assert a real captured default (a real Table 6 cell) against a concrete, textually stated alternative this workspace's policy space merely cannot yet select; this coordinate's alternative is one JLReq's own citation says no single answer is required for at all, residual and open-ended rather than a stated ceiling, so a `kind: \"none\"` case here would assert a JLReq requirement that, on this coordinate's own evidence, does not exist to assert — measuring jlreq's own bookkeeping choice to leave the JIS X 4051 alternative unimplemented rather than anything JLReq's own text requires of a conforming engine."

