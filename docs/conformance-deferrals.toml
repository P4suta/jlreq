why = "The note states the preferred zero space between the line head and an opening bracket (cl-01) and an alternative that keeps a conditional half em, and names §3.1.5 by section title as the place that alternative is laid out. Task #42 (round 15) read that cross-reference as the identification and wired `Question::LINE_HEAD_OPENING_BRACKET`'s own `pattern-2` answer to synthesize exactly this note's own alternative at Table 1's `(0, 1)` coordinate; task #47 (round 17) is the independently authored case phase ADR 0006 requires for it, `B.2/opening-bracket-at-line-head/the-preferred-zero-and-the-retained-half-em`, derived from this note's own two sentences and from the generated tables before this round's own suite run. The preferred zero is a real, checked fact under the declared default: the `{}` entry asserts `spaces: []` together with `rules: [\"B.2#17\"]` at the line head before cl-01, and `rules_fired` puts `RuleId::B_2_NOTE_17` into its own placement slot from Table 1's own `(0, 1)` cell regardless of `spacing.line_head_opening_bracket`'s own answer, so the citation is observable at `Policy::JLREQ`'s own default `pattern-1` even though the half-em space `pattern-2` alone produces is not — `crates/jlreq-conform/src/run.rs`'s own `applicable()` excludes the `pattern-2`-keyed entries below from a `Policy::JLREQ` run without `unselectable()` counting them, the identical standing `3.1.6`'s own entry already states for its own ten quarter-em-keyed siblings. What remained open before this round was not whether the alternative fires — round 15 already proved that in `crates/jlreq-spacing/src/evaluate.rs`'s own test module — but what it should carry: whose em the half em is a fraction of, whether Appendix D's reduction tables govern it, and which of this note's two paired addresses should be cited. This round's own case settles the referent question independently of round 15's own argument, from a class-level pattern round 15's own decision record did not check: `spec/captured/table1.en.tsv`'s own cl-01 column reads a trailing half em, `1/2 af`, at essentially every `before` class this workspace has, so cl-01 genuinely has an 'accompanying' half em of its own for the note's own English ('not to remove a conditional half em spacing accompanying the characters') to retain, independent confirmation of `Referent::Trailing` rather than a re-litigation of it. This round's own case also repairs the reduction question's own ground rather than its answer: round 15's own doc reasoned from `(0, 1)`'s own row in Tables 3 through 5 being the tables' total-grid boilerplate for an absent term, true but narrower than the fact that actually settles it — not a categorical claim that Appendix D's reduction mechanism, scoped to an opportunity 'between two adjacent characters' (`spec/derived/rules.tsv`'s own row for rule `D`), excludes any line edge by definition (a line end has the identical single-neighbor structure, and Appendix D genuinely does reduce real terms there — this file's own `D.1` entry above names the coordinate directly, its own case titled `table-4-protects-what-table-3-and-5-drain`, and `3.1.9`'s own entry above states the identical \"discrete/rigid/discrete shape\" again at a second class), but the narrower, purely empirical fact that the line-*head* row specifically is uniformly rigid across all three tables — `xtask/src/attest.rs`'s own `no_reduction_at_the_line_head` invariant confirms this holds without exception across the entire line-head row of Tables 3, 4 and 5, not only at cl-01's own coordinate (`docs/design/generation.md`'s own cross-table invariant 4). `Reduction::Rigid` is consequently the corrected answer, not a disagreement with round 15's own `Reduction::Rigid` — the case's own third `permitted` entry states the corrected ground positively, publishing Table 5 (the one reduction table whose own interior schedule for cl-01 never drains fully to zero) as still rigid at the line head, and its own `forbidden` entry names the misreading — importing cl-01's real interior schedule wholesale — that the retention framing alone, without the structural argument, would wrongly predict. What remains true of this note that this round does not change: the citation is observable at boundary granularity and still unobservable at space granularity, the split task #44 (round 16) drew on purpose — `ExpectSpace::rule` is still parsed and never read, and `CaseSpace`, the answer side, still carries no `rule` field to compare it against at all, a published API-surface change against `docs/api-frozen.toml` and a round of its own rather than a case-authoring one."

