rule = "3.3.9"
milestone = "M4"
why = "The unified `jlreq` pipeline now repeats the caller-selected mark once per shaped base cluster, sizes each mark to one half of that cluster's own inline and block size, centers it on the cluster advance, places it on block-start (above in horizontal-tb and right in vertical-rl), and reserves the largest mark extent for line progression. Protocol-v1 cases `3.3.9/emphasis-horizontal-mixed-size` and `3.3.9/emphasis-vertical-mixed-size` measure the complete geometry through the language-independent process boundary, including two unequal base sizes, symbol choice, attachment count, centering, touching-side coordinates, and line block extent; `crates/jlreq/tests/public_api.rs` independently exercises the same facts through the no_std library surface."
