mes the misreading — importing cl-01's real interior schedule wholesale — that the retention framing alone, without the structural argument, would wrongly predict. What remains true of this note that this round does not change: the citation is observable at boundary granularity and still unobservable at space granularity, the split task #44 (round 16) drew on purpose — `ExpectSpace::rule` is still parsed and never read, and `CaseSpace`, the answer side, still carries no `rule` field to compare it against at all, a published API-surface change against `docs/api-frozen.toml` and a round of its own rather than a case-authoring one."

