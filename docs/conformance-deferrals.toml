milestone = "M2"
why = "The rule states no amount at all, so there is nothing here for `jlreq-spacing` to answer. Its body is 'There are a lot of examples of Japanese text in which Western and/or Greek letters are mixed among Japanese letters' followed by four illustrative bullets — 'A' and 'B' used as symbols, 'editor' as a Western word, 'DTP' and 'GDP' as acronyms, Western book titles quoted with original spelling — and three Notes: whole Western paragraphs quoted in Japanese documents, a katakana-versus-SI choice for unit symbols that differs by writing mode, and a cross-reference to JIS X 4051 4.7. None of it is a rule a case can measure against; the one fact with any testable residue at all — that a proportionally-set Latin letter is cl-27 — is already owned at M0 by §3.2.6, and §3.2.2's own case this round restates that identical fact under its own address for the identical reason (`3.2.2/proportional-latin-letter/the-basic-approach-in-horizontal-writing`), which is the same mechanism this entry declines to apply to §3.2.1 itself in this round. The §B precedent recorded above for `B/opening-bracket-then-middle-dot/an-unnoted-cell-cites-appendix-bs-own-sentence` does not transfer: §B's opening sentence genuinely is the amount Table 1 realizes cell by cell, where §3.2.1's opening sentence is motivating prose introducing four examples, with no table anywhere keyed to it. No milestone unblocks this rule in the sense every other entry in this file means one — a crate that does not exist yet, which will supply a new answer once it arrives — because the rule's only testable residue is answered today, by a crate (`jlreq-class`) that has existed since M0; what is missing is not a layer but a case crediting this address, which this round declines to write because it would add zero new derived content beyond what §3.2.6's own entry already covers. `milestone = \"M2\"` is kept as the closest available label rather than corrected to something more precise, because the one part of this rule's own body with any future mechanical shape at all — the second Note's katakana-versus-SI choice over a unit symbol, which differs by writing mode — reaches at earliest into the M2-through-M5 band this file already uses for unit-symbol spacing (`B.2#12`'s own entry) and vertical composition (§3.1.3's own entry above), not into any single milestone this rule's own text picks out. This is recorded as an open finding rather than resolved by fiat: a future round should decide whether a restating case for a rule with no content beyond what another address already owns is wanted at all, the same question this round answers 'yes' to for §3.2.2 and leaves unanswered here."

