why = "The rule's own three enumerated cases are all vertical-writing-mode: 'In vertical writing mode, ideographic numerals and IDEOGRAPHIC COMMA used as a decimal separator are set solid', the Note about ideographic digits representing an approximate number, and 'In vertical writing mode, ideographic digits and KATAKANA MIDDLE DOT representing a decimal point are set solid'. M5 is the earliest milestone at which any of the three can be composed at all, because none of them has a horizontal reading to fall back on. The rule's own closing Note is a second, partial blocker: it is the recorded locale divergence `line-composition-note-locale-divergence` in spec/derived/defects.tsv, whose English half opens 'In vertical writing mode' and whose Japanese half opens 横組において (in horizontal writing mode) at the same sentence, so a reader must choose which half to follow before either can be coded at all — but both halves scope the solid setting to the same three constructs, a KATAKANA MIDDLE DOT playing a role inside cl-25 unit symbols, cl-24 grouped numerals or cl-27 formulae (checked directly against the English and Japanese halves of the Note); the writing-mode word is not the only place the two halves diverge, and `A.24/katakana-middle-dot/inside-a-grouped-numeral`'s own rationale records the other one — the English reads the dot as cl-25 across all three constructs where the Japanese states three independent cases. Of the three constructs, two already have a working declaration mechanism at M0, even though this exact Note is not what publishes either reading: `crates/jlreq-conform/src/kumihan.rs`'s own `role_of` already carries `unit-symbol` and `digit-group-separator` in its published vocabulary, and both already produce their construct-membership class today — `A.25/katakana-middle-dot/unit-symbol-role`'s own case declares this identical key's `role` as `unit-symbol` and reads cl-25 out of it, and `A.26/digit-grouping-space/quarter-em-frame-and-role`'s own case declares `digit-group-separator` and reads cl-24 out of a different key. (This Note's own middle-dot-inside-a-grouped-numeral reading stays unstated regardless: `A.24/katakana-middle-dot/inside-a-grouped-numeral`'s own case declares no role for that reason and resolves between cl-05 and cl-25, not cl-24, so the mechanism existing is not the same fact as this occurrence being classified.) Only the formula reading has no path at all: none of `role_of`'s six values (`decimal-point`, `digit-group-separator`, `unit-symbol`, `quantity-symbol`, `sentence-terminator`, `sentence-medial`) lets a case declare an occurrence as sitting inside a mathematical or chemical formula, so that construct cannot be expressed by any case today, unlike the other two; §3.7.4's own M4 entry, which credits `jlreq-inline` with building the formula a case would need, is the closest anchor this file has for when that declaration becomes possible, though it answers spacing around a formula rather than classification inside one. So M5 is not the only milestone this Note's own half needs, but the reason is narrower than construct classification in general. docs/direction-sites.toml is the file that defers the reader which must choose between the two halves; it is not itself the reason no code has taken either, but it is where that choice will be recorded once made, and it is why no code has taken either half today."

[[deferred]]
