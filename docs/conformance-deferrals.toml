[[editorial]]
rule = "3.3.2"
why = "Read against the specification's own words (spec/snapshot/index.html, the second 'Choice of Base Characters to be Annotated by Ruby' section) rather than against what this crate happens to compute, this rule is not about lowering at all, and the blocker its own former entry named — that no conformance kind observed a `Contribution` — is retracted rather than merely closed now that `lower` cases exist (task #74), because closing it would not have reached this rule regardless. §3.3.2's body states three editorial methods an author chooses among before ever declaring a `Ruby` — general-ruby (総ルビ, annotating every cl-19 occurrence), para-ruby (パラルビ, annotating only the difficult ones), and para-ruby's own further split between annotating every occurrence and only the first, itself subdivided by whether 'first' is counted per book, per chapter, or per spread — plus a closing recommendation that a compound word (熟語) should receive ruby on *all* its cl-19 characters rather than only some, illustrated by Figure 113's own contrast of a recommended and a not-recommended layout. Every one of the first three is a choice the caller makes before calling `Ruby::new` at all: `Constructs::with_ruby`'s own input is `base` already chosen, and no fact upstream of that choice is `jlreq_inline::lower`'s to compute or a `Contribution` to report — a `lower` case could only ever observe the *consequence* of an editorial choice already made, never adjudicate whether the caller made the recommended one. The closing sentence is likewise explicit editorial guidance: it says that partial ruby on a compound is “not recommended” / 望ましくない, not that a layout engine must reject, reposition, or diagnose it. Inventing a future layout diagnostic would turn advice into an engine requirement JLReq does not state. The rule is therefore `[[editorial]]`, with no empty conformance case and no implementation milestone."

