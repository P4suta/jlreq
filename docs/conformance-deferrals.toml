why = "The rule's first two sentences restate content already owned at M0: proportional Western fonts are the basic approach in horizontal writing mode (cl-27, §3.2.6's Note) and a European numeral is set on either a half-width or a proportional font (cl-24 or cl-27, the same Note). 3.2.2/proportional-latin-letter/the-basic-approach-in-horizontal-writing and 3.2.2/half-width-european-numeral/both-half-width-and-proportional-fonts-are-used reuse `A.27/latin-capital-a/proportional-frame`'s and `A.24/digit-zero/half-width-numeral`'s own inputs unchanged, crediting this rule's own address for the first time; §3.2.6's own entry above is where these readings are genuinely decided, and this entry restates them for the horizontal writing mode exactly as their own rationale says. The rule's third sentence is the distinctive content this address earns: Western word space (cl-26) is a one third em space in principle, the place this default amount is normatively established — §3.8.3's and §3.8.4's own reduction/expansion-order lists each restate it in passing ('which is usually one third em') without establishing it — and 3.2.2/western-word-space/the-third-em-in-principle is the first case in this suite to credit that geometry's classification to this rule's own address: `A.26/word-space/third-em-frame` and `A.26/word-space/vertical-writing-mode` already classify the identical third-em occurrence but name only §3.9.1 and §3.9.2 in their own `rules` field. §A.26's own row for U+0020 states no width at all, and §A.24's and §A.25's own listings of the same key both state a quarter-em qualification the third em does not meet at all. The quarter-em-declared coordinate `crates/jlreq-class/src/classify.rs`'s own test module already reads (`resolved(\"\\u{0020}\", Frame::QuarterEm, Role::Unstated)`) leaves §A.24 and §A.25 standing beside cl-26 and passes over them by this project's own published tie-break (`Standing::Unstated`) — a different route to that same standing from `A.26/word-