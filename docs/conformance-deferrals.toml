rule = "3.5.4"
milestone = "M3"
why = "Widow adjustment moves a break so that the last line of a paragraph carries enough characters. Task #57 (round 21) wrote the implementation: `demerits_of` — the one cost function `Search::FirstFit` and `Search::Optimal` both read — adds a shortfall-proportional term to `Demerits::structural` on a paragraph's own last line, and a `ViolationKind::Widow` naming this rule is reported when the arrangement a search finally settles on still falls short (`docs/decisions/widow-threshold.md`). Task #58 (round 22) is the independently authored case phase ADR-0006 requires for it, `crates/jlreq-conform/cases/3.5.4.json`, three cases derived from §3.5.4's own sentence and from `docs/decisions/widow-threshold.md`'s own four published readings before this round's own suite run, extending the case format with `input.widow_threshold` (`cases.schema.json`'s own description) to let a case state the threshold at all — no case could name this rule before that field existed. What is covered, and by which reading: Q2 — whether a paragraph occupying a single line can itself carry a widow — is `3.5.4/one-line-paragraph/the-only-line-is-still-the-last-line-and-can-be-a-widow`, a two-item, one-line paragraph (`亜亜`) composed with an empty `candidates` array, so the whole text is necessarily one line (`jlreq_line::Candidate`'s own doc: the last line ends where the text does whether or not a candidate says so), whose declared threshold (3) exceeds its own item count (2); the exempting alternative — a one-line paragraph read as immune because it has no earlier line to be short relative to — is stated and rejected in that case's own `forbidden` entry, because §3.5.4's own words carry no such exemption. Q1 — what \"a character\" counts as — is the pair `3.5.4/last-line-item-count/a-threshold-equal-to-the-count-is-satisfied` and `3.5.4/last-line-item-count/a-threshold-past-the-count-is-a-widow`: a two-line paragraph whose last line is two items (`fi` and `if`, two Western-letter clusters on the proportional frame, ADR-0018's own Western-ligature exception) but four code points and four bytes, so an implementation counting either of those instead of items would answer the second case's own `violations` differently from one that counts items the way `docs/decisions/widow-threshold.md`'s own Q1 reads \"a character\" — and the code-point and byte counting alternatives are both stated and rejected in that second case's own `forbidden`, not only in this entry's own prose. Q4 — that an unsatisfiable threshold is met with graceful degradation and an honest violation rather than a refusal — is carried through the same channel by the one-line case above and by the second Q1 case: each has a non-empty `lines` beside a real `violations: [\"3.5.4\"]`, which is what the claim actually is (ADR-0010's own \"composition never refuses to produce lines\"); the first Q1 case, whose own threshold is satisfied, carries no Q4 evidence and is not counted among these two. The second Q1 case's own `forbidden` additionally rejects the relaxation alternative — the threshold silently lowered until the unchanged last line is satisfied — by name, for the reason `docs/decisions/tolerance-exhaustion.md` already gives a structurally identical unsatisfiable-constraint case. Every case's own `standing` is `normative` rather than `unstated`, even though each turns on a published reading of a silence: `conform --check`'s own `check_standing` (ADR-0006) requires `permitted` to carry more than one reading whenever `standing` is `unstated`, `adjudicated` or `alternative`, and none of these three cases has a second reachable answer under any `Policy` question — the rejected alternative in each case lives in `forbidden`, which carries no such requirement, because no policy this workspace has reaches it either. What a run of this suite actually measures, and what it cannot: `crates/jlreq-conform/src/kumihan.rs`'s own `compose` maps every entry of `composition.violations()` through `violation.rule.address().to_string()` alone, discarding `ViolationKind::Widow`'s own `have` and `want` before the case format ever sees them, so this suite checks that §3.5.4 was violated, never by how much — the one channel `Demerits` (this crate's own invented objective function, never itself a JLReq-shaped fact `docs/decisions/widow-threshold.md`'s own \"Why\" states) leaves for a case to assert at all. Two of the four readings stay outside what a case can measure, named rather than left to look covered: Q3, the penalty's own shape (flat or shortfall-proportional), is unconstructible in this format for a reason sharper than difficulty deriving one fixture by hand — no `Policy` question selects a flat penalty, so even a fixture built to show `Search::Optimal` preferring the smaller of two shortfalls would only be consistent with the proportional reading, never a refutation of the flat one in the conformance format's own terms, because the flat alternative has no reachable answer for any case to compare against. Q1's own hanging wrinkle — that a last item `crate::ladder::hang` lets hang past the measure is still counted — requires `adjustment.hanging_punctuation = hanging`, which `Policy::JLREQ` does not select, so a case exercising it would be published but never attempted by `cargo nextest`'s own `section_3_5_4` test, the identical unexercised standing `3.8.2.json`'s own rationale already states about itself; this round declines to publish one for that reason rather than let an unattempted case read as coverage. Coverage consequently rests on Q1's own discriminating pair and Q2's own single-line case, real and attempted (`3 attempted, 0 not attempted`), with Q3 and the hanging wrinkle named as open rather than covered."

