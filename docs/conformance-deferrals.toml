why = "The note gives a third order expansion opportunity between two different simple-ruby character complexes and denies one inside a complex — same-run breakability, which no table cell can express (ADR-0015). The coordinate's own reachability defect is fixed by this round (ADR-0021): Table 6's own cl-22-against-cl-22 cell is real (`0-1/4 stage 3`, citing this note), and `jlreq_spacing::Boundary::expansion` now reads it independent of Table 1's own terms. What the earlier reading of this entry got wrong, independent of M4-a and worth correcting now that M4-a exists to correct it against: `jlreq_class::resolve` does not \"compute no run overlay until jlreq-inline places ruby\" — it takes no construct parameter at all, ever, by design (`jlreq_class::classify`'s own module doc: nine of the thirty classes are membership in a construct, and `resolve`'s own tie-break \"may not answer *with* one of those nine\"), so no future state of `jlreq-inline` changes what `resolve` itself can be asked. Run identity for cl-22 is real now — M4-a round 1's own `jlreq_inline::lower` genuinely allocates a fresh `RunId` per mono-ruby base item — but `crates/jlreq-conform`'s own `Compose::boundary` and `Compose::compose` are what would have to read it to exercise this note, and both decline unconditionally the moment a case declares any construct at all (`crates/jlreq-conform/src/kumihan.rs`'s own module doc: \"neither `jlreq_line::Paragraph` ... has a way to carry one through\"), independent of whether a `Runs` overlay exists to give them. The honest blocker after this round is consequently two facts and not one: no case declares two adjacent mono-ruby complexes, and even one that did could not be checked by `boundary` or `compose` today. Two kinds now read a case-declared overlay — `feasible`, since M1 round 11, and `lower`, new this round (M4-a round 2) — but neither reaches this note's own subject: `feasible` answers break-refusal, and `lower` answers what `jlreq_inline::lower` itself resolved (run identity, forced separation, mono-ruby alignment), never Table 6's own expansion amount, which is `jlreq_line`'s and `jlreq_spacing`'s own question and reaches neither adapter method. Moved from M1 to M4 to match the milestone that builds the run identity a future runner change would need."

[[deferred]]
