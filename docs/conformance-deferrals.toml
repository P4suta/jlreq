why = "The note gives a third order expansion opportunity between two different jukugo-ruby character complexes and denies one inside a complex — same-run breakability, which no table cell can express (ADR-0015), and the identical argument `crates/jlreq-line/src/ladder.rs`'s own §3.1.11 item 2(g) discussion already makes for jukugo-ruby base runs: 'an ordinary cl-19×cl-19 boundary is expandable, but the same class pair inside one jukugo-ruby complex's base run is not, and only run identity... distinguishes the two.' The coordinate's own reachability defect is fixed by this round (ADR-0021): Table 6's own cl-23-against-cl-23 cell is real (`0-1/4 stage 3`, citing this note), read independent of Table 1's own terms now. Run identity for cl-23 exists in the same narrow sense E.2#6's own entry above now states for cl-22: `jlreq_inline::lower` gives a jukugo-ruby compound one shared `RunId` across its own base range (M4-a round 1), but jukugo-ruby lowering is itself the unfilled slot named in `jlreq_inline::lower`'s own module doc — `Question::JUKUGO_RUBY_LAYOUT` and Appendix F are not read this round, so a jukugo `Ruby` only ever gets identity and block demand, nothing this note's own expansion opportunity could be checked against yet even setting the runner question aside. And the runner question stands regardless: `crates/jlreq-conform`'s own `Compose::boundary` and `Compose::compose` decline unconditionally over any declared construct (`crates/jlreq-conform/src/kumihan.rs`'s own module doc), so `jlreq_class::resolve`'s own construct-blindness — permanent by design, not a fact `jlreq-inline`'s own arrival changes — was never the accurate way to state this note's blocker either. Moved from M1 to M4 to match the milestone that builds the run identity a future runner change would need."

[[non-observable]]
rule = "E.2#11"
why = "The note offers an alternative way to give a fourth order expansion opportunity between two Western characters, but — unlike E.2#8's and E.2#9's own alternatives, each of which states a concrete ceiling (E.2#9's own words: 'to take up to a maximum of a quarter em space') — it states no ceiling at all: 'fourth order' is §3.8.4 step (d)'s own residual stage, the one `Expansion::Residual` represents, open-ended by definition rather than merely uncaptured. That distinction is what this round's decision turns on, not reachability, which is no longer the blocker (ADR-0021). Table 6's own cl-27-against-cl-27 cell states `limit: None` as its own captured default, confirmed directly against `spec/captured/table6.en.tsv`'s own reconciliation note, which records that 'note 11 -- on a *white* cell -- offers \"an alternative way to give a fourth order opportunity\" only as a deviation from the table's own default reading of \"blank\"' — the blank cell is what the source PDF's own fill color states, not a placeholder standing in for an unresolved note. `Boundary::expansion_rule()` reads `Some(RuleId::E_2_NOTE_11)` at this coordinate regardless of that default (ADR-0021's own amendment, 2026-08-09), and no question in `spec/derived/questions.tsv` is addressed to `E.2#11` (checked directly).\n\nThe classification decision: no case is authored, and this rule is `[[non-observable]]` because the cited provision leaves no single required black-box result. §3.8.4 step (d)'s own Note — the only other place in the document that discusses a fourth-order opportunity at this identical class pair, naming 'the spacing between Western characters (cl-27)' explicitly — attributes the residual expansion this coordinate would carry to a JIS X 4051 provision that JIS itself calls 処理系定義 (implementation-defined): 'it depends on each layout processing system whether inter-character spacing should be added equally. This includes the spacing between Western characters (cl-27)' (spec/snapshot/index.html, the Note under §3.8.4 item (d), id 'n173'). This connection is an inference from coordinate coincidence rather than a citation E.2 note 11's own sentence states directly — note 11's own text (spec/snapshot/index.html, list item id668) reads exactly as concretely as note 9's, 'There is an alternative way to give a fourth order opportunity...', with no reference to JIS X 4051 or to any standard's own discretion — but step (d)'s Note is the only sentence anywhere in JLReq that discusses a residual, fourth-stage opportunity at cl-27-against-cl-27, and it is explicit that the specification JLReq is itself built on treats the question as outside its own scope to answer, for exactly this class pair. A case asserting `expansion: { kind: \"none\", rule: \"E.2#11\" }` would consequently not be making the same kind of claim the cases under `E.2#8` and `E.2#9` above make: those assert a real captured default (a real Table 6 cell) against a concrete, textually stated alternative this workspace's policy space merely cannot yet select; this coordinate's alternative is one JLReq's own citation says no single answer is required for at all, residual and open-ended rather than a stated ceiling, so a `kind: \"none\"` case here would assert a JLReq requirement that, on this coordinate's own evidence, does not exist to assert — measuring kumihan's own bookkeeping choice to leave the JIS X 4051 alternative unimplemented rather than anything JLReq's own text requires of a conforming engine."

