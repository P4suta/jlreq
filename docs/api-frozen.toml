# The frozen API file: the machine-readable half of docs/design/api-spine.md.
#
# Written at M0 with its full contents, before the types it governs exist. A gate authored
# against types that already compile is a gate written to pass them, which inverts its
# purpose (docs/adr/0012-outcome-and-detail-compatibility.md). It is owned by the code
# owners, so every one of these lists is relaxed only by review.
#
# Read by the `api` gate (the `[[frozen]]`, `[[exempt]]`, `[[forbidden]]` and
# `[[closed_choices]]` tables) and by the `ops` gate (the `[[no_impl]]`,
# `[[no_public_constructor]]` and `[[scalar_channel]]` tables). `[[closed_choices]]` is the
# frozen record of the choice sets the specification closes, and the `api` gate now holds
# spec/derived/questions.tsv to it: a question whose answer set grew past the count below
# fails, and so does a count naming a question the derived policy space does not record. It
# was stated here before that check existed, and before the data that could grow it, because
# a count written down afterwards is not a control.
#
# The contents are the ones docs/design/api-spine.md publishes under "The frozen API file",
# entry for entry and comment for comment. Only the array layout differs: this file is
# taplo-formatted, as `just toml-check` requires, and the copy embedded in the spine is
# indented for prose. The two agree in content, not byte for byte.
#
# Two definitions the `api` gate needs, pinned in the API spine rather than settled by
# whatever the code turns out to do. A public type is in an *input position* when it appears
# in the parameter list of any public function in the workspace other than as the receiver,
# including inside a reference, a slice, a range, an `Option` or a `Result`. A *named
# constructor* is an associated function returning `Self`, `Result<Self, _>`, or
# `Option<Self>`.

# Output enums that are open, each with the total accessor whose answer set is frozen.
[[frozen]]
type = "jlreq_spacing::Boundary"
projections = ["is_breakable", "is_permitted"]
[[frozen]]
type = "jlreq_line::Fit"
projections = ["is_feasible"]
[[frozen]]
type = "jlreq_line::Composition"
projections = ["is_conforming"]
[[frozen]]
type = "jlreq_class::Classified"
projections = ["is_ambiguous"]
[[frozen]]
type = "jlreq_class::Usage"
projections = ["is_restricted"]
[[frozen]]
type = "jlreq_class::TextError"
projections = ["is_segmentation"]
[[frozen]]
type = "jlreq_class::Subject"
projections = ["is_boundary"]
[[frozen]]
type = "jlreq_spec::Provenance"
projections = ["is_specified"]
[[frozen]]
type = "jlreq_line::Line"
projections = ["is_last"]

