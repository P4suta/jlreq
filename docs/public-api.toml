# The decision trace. Deliberately outside the compatibility promise the other modules
# carry: these names exist so a person can read why a layout came out as it did, and
# `docs/adr/0028` records why that channel is allowed to move between releases while the
# result and its diagnostics are not.
[[module]]
path = "jlreq_core::trace"
items = ["Categories", "Event", "Fact", "RuleAddress", "Site", "Trace"]

# The invariant harness. Also outside the compatibility promise: it exists so a caller, a
# test, or a fuzz target can ask whether a layout is self-consistent, and the set of
# invariants it names is expected to grow.
[[module]]
path = "jlreq_core::verify"
items = ["Fault", "Report", "inspect"]

# The facade half of the same channel, and outside the compatibility promise for the same
# reason. It answers what the core cannot see: how the document was cut up, how graphemes
# became shaping runs, and which face was asked to cover each one.
[[module]]
path = "jlreq::trace"
items = [
  "Categories",
  "DocumentTrace",
  "Event",
  "Fact",
  "RunDirection",
  "Script",
  "Site",
]

# The facade half of the invariant harness, outside the compatibility promise for the same
# reason as the core's. It states what must be true of the physical geometry a renderer is
# handed — that the cells a glyph is drawn into, the ones hit testing measures against, and
# the ones carets are cut from are the same cells — and that set is expected to grow.
[[module]]
path = "jlreq::verify"
items = ["Fault", "Report", "inspect"]

