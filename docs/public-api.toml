# Public names released by the jlreq 0.1.0 facade and core. The `api` gate checks this list in both directions;
# every compatible 0.1.x release must preserve it. The `semver` gate reads the release
# contract below and compares later 0.1.x candidates with the latest published jlreq-core
# and jlreq releases.
# Implementation modules remain private.

baseline_version = "0.1.0"
compatible_series = "0.1"

[[module]]
path = "jlreq"
items = [
  "Affinity",
  "Alignment",
  "AnnotationSource",
  "BaseDirection",
  "Diagnostic",
  "DiagnosticSeverity",
  "Document",
  "DocumentBuilder",
  "FontId",
