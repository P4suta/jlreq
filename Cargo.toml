[workspace]
resolver = "3"
members = [
  "crates/jlreq",
  "crates/jlreq-core",
  "crates/jlreq-conformance",
  "xtask",
]
# cargo-fuzz requires nightly and a sanitizer runtime.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Floor imposed by edition 2024.
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Yasunobu Sakashita <crates.tank733@slmails.com>"]
repository = "https://github.com/P4suta/jlreq"
homepage = "https://github.com/P4suta/jlreq"

# Inter-crate dependencies are declared as each crate's code starts needing them, so
# `cargo shear` stays meaningful. The intended graph is in ARCHITECTURE.md.

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Production code must not use unwrap, expect, panic, or unreachable fallbacks.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
# Layout arithmetic must state its overflow behavior explicitly.
arithmetic_side_effects = "warn"
missing_errors_doc = "allow"

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
# docs.rs builds pass `--cfg docsrs` to enable doc(cfg) feature badges.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[profile.release]
lto = "thin"
codegen-units = 1
