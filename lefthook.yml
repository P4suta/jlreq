# Install with `mise run hooks`.

min_version: 2.1.9
assert_lefthook_installed: true
no_tty: false
colors: true

commit-msg:
  commands:
    conventional:
      run: mise exec -- committed --commit-file {1}

pre-commit:
  parallel: false
  follow: true
  commands:
    cargo-fmt:
      tags: format
      glob: "*.rs"
      run: mise exec -- just fmt
      stage_fixed: true

    taplo-fmt:
      tags: format
      glob: "*.toml"
      run: mise exec -- taplo fmt
      stage_fixed: true

    # `--force-exclude` is load-bearing: without it typos ignores the `extend-exclude`
    # of typos.toml for paths named on the command line, and `{staged_files}` names every
    # path. `--write-changes` would then "correct" the vendored specification snapshot and
    # break the digests that prove it is upstream's (docs/design/generation.md). The
    # exclusion policy stays in typos.toml alone; this flag makes the hook obey it.
    typos:
      tags: spell
      run: mise exec -- typos --force-exclude --write-changes {staged_files}
      stage_fixed: true

    clippy:
      tags: lint
      glob: "*.rs"
      run: mise exec -- just lint
      fail_text: "Clippy failed; fix every warning before committing."

    purity:
      tags: lint
      glob: "{**/Cargo.toml,**/*.rs}"
      run: mise exec -- just purity
      fail_text: "The layout core gained a std, I/O, or font dependency (docs/adr/0001)."

    reuse:
      tags: license
      glob: "{**/*.rs,**/*.toml,**/*.md,**/*.yml,Justfile,REUSE.toml,LICENSES/*}"
      run: mise exec -- just reuse

pre-push:
  parallel: false
  follow: true
  commands:
    local-ci:
      tags: ci
      run: mise exec -- just ci
      fail_text: "Local CI failed; fix the reported gate before pushing."

# Explicit manual entry point: `lefthook run local-ci`.
local-ci:
  parallel: false
  follow: true
  commands:
    all:
      tags: ci
      run: mise exec -- just ci
