# Clippy thresholds used by CI.
avoid-breaking-exported-api = false
cognitive-complexity-threshold = 15
too-many-arguments-threshold = 7
type-complexity-threshold = 250
too-many-lines-threshold = 250
# Public style/profile values intentionally travel by shared reference. Keep the
# pass-by-value suggestion for genuinely scalar carriers only.
trivial-copy-size-limit = 16
pass-by-value-size-limit = 256
# `jlreq_inline::RubyStyle` names JLReq's own three attachment styles — mono-ruby,
# group-ruby, jukugo-ruby — and the shared "Ruby" postfix is `docs/design/api-spine.md`'s
# own pinned vocabulary, not a naming accident this lint exists to catch. The default
# threshold (3) fires on any three-variant enum sharing an affix; raising it by one exempts
# only enums this small, which is the whole of what this crate's own construct-style
# enumerations are.
enum-variant-name-threshold = 4

# Domain vocabulary that `clippy::doc_markdown` would otherwise ask us to wrap in
# backticks. These are proper nouns in prose, not code identifiers. `..` extends
# Clippy's default list rather than replacing it.
doc-valid-idents = [
  "JLReq",
  "CLReq",
  "ReSpec",
  "InDesign",
  "HarfRust",
  "ICU4X",
  "rustybuzz",
  "..",
]

# Test-only exceptions.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true

disallowed-macros = [
  { path = "lazy_static::lazy_static", reason = "use core::cell::OnceCell or std::sync::LazyLock" },
]
disallowed-types = [
  { path = "once_cell::sync::Lazy", reason = "use std::sync::LazyLock (stable since 1.80)" },
  { path = "once_cell::sync::OnceCell", reason = "use std::sync::OnceLock (stable since 1.70)" },
  # Line composition must be reproducible: identical input yields byte-identical
  # output on every platform, so iteration order can never be incidental.
  { path = "std::collections::HashMap", reason = "non-deterministic iteration; use BTreeMap or a sorted Vec" },
  { path = "std::collections::HashSet", reason = "non-deterministic iteration; use BTreeSet or a sorted Vec" },
]
