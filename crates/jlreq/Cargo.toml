[package]
name = "jlreq"
publish = false
description = "Japanese line composition following JLReq and JIS X 4051, with no font or I/O dependency"
keywords = ["japanese", "typesetting", "jlreq", "text-layout", "no-std"]
categories = ["text-processing", "internationalization", "no-std"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
jlreq-class = { path = "../jlreq-class", version = "0.0.0" }
jlreq-inline = { path = "../jlreq-inline", version = "0.0.0" }
jlreq-line = { path = "../jlreq-line", version = "0.0.0" }
jlreq-spacing = { path = "../jlreq-spacing", version = "0.0.0" }
jlreq-spec = { path = "../jlreq-spec", version = "0.0.0" }
jlreq-unit = { path = "../jlreq-unit", version = "0.0.0" }

[lints]
workspace = true
