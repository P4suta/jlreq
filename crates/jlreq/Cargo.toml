[package]
name = "jlreq"
description = "Draw-ready Japanese text layout from UTF-8 text and font data"
keywords = ["japanese", "typesetting", "jlreq", "text-layout", "shaping"]
categories = ["text-processing", "internationalization", "graphics"]
readme = "README.md"
documentation = "https://docs.rs/jlreq"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
include = [
  "src/**",
  "tests/**",
  "examples/**",
  "Cargo.toml",
  "README.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
]

[features]
default = []
system-fonts = ["dep:fontique"]

[dependencies]
harfrust = { version = "=0.13.3", default-features = true }
icu_segmenter = { version = "=2.3.0", default-features = true }
jlreq-core = { version = "0.1.0", path = "../jlreq-core" }
unicode-bidi = { version = "=0.3.18", default-features = true }

[dependencies.fontique]
version = "=0.11.1"
default-features = false
features = ["system", "fontconfig-dlopen"]
optional = true

[dev-dependencies]
font-test-data = "=0.9.1"
rwml-fonts = "=0.1.4"

[lints]
workspace = true
