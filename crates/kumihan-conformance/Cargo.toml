[package]
name = "kumihan-conformance"
description = "Language-independent black-box conformance runner for kumihan engines"
default-run = "kumihan-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "kumihan-conformance"
path = "src/main.rs"

[[bin]]
name = "kumihan-sample-engine"
path = "src/sample_engine.rs"

[dependencies]
kumihan = { version = "1.0.0", path = "../kumihan" }
serde_json = "1.0"

[dev-dependencies]
harfrust = "=0.12.0"
icu_segmenter = "=2.1.2"

[lints]
workspace = true
