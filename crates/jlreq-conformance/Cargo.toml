[package]
name = "jlreq-conformance"
publish = false
description = "Language-independent black-box conformance runner for jlreq engines"
default-run = "jlreq-conformance"
keywords = ["japanese", "typesetting", "jlreq", "conformance", "text-layout"]
categories = ["command-line-utilities", "development-tools::testing"]
readme = "README.md"
documentation = "https://github.com/P4suta/jlreq/tree/main/crates/jlreq-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "jlreq-conformance"
path = "src/main.rs"

[[bin]]
name = "jlreq-sample-engine"
path = "src/sample_engine.rs"

[dependencies]
jlreq = { version = "0.0.0", path = "../jlreq" }
serde_json = "1.0"

[dev-dependencies]
harfrust = "=0.13.0"
icu_segmenter = "=2.1.2"

[lints]
workspace = true
