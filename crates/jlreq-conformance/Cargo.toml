[package]
name = "jlreq-conformance"
description = "Language-independent black-box conformance runner for jlreq engines"
default-run = "jlreq-conformance"
keywords = ["japanese", "typesetting", "jlreq", "conformance", "text-layout"]
categories = ["command-line-utilities", "development-tools::testing"]
readme = "README.md"
documentation = "https://github.com/P4suta/jlreq/tree/main/crates/jlreq-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
include = [
  "src/**",
  "tests/**",
  "Cargo.toml",
  "README.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
  "protocol.schema.json",
  "suite.ndjson",
]

[[bin]]
name = "jlreq-conformance"
path = "src/main.rs"

[[bin]]
name = "jlreq-sample-engine"
path = "src/sample_engine.rs"

[[test]]
name = "transport"
path = "tests/transport.rs"
harness = false

[dependencies]
jlreq-core = { version = "0.1.0", path = "../jlreq-core" }
serde_json = "1.0"

[dev-dependencies]
harfrust = "=0.13.3"
icu_segmenter = "=2.3.0"

[lints]
workspace = true
